<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Edytor mapy — EwolucJA</title>
<!--
  Edytor mapy świata 3D.

  Czym jest: rzut z góry na `mapa.json` — plik, z którego scena bierze całą
  geometrię (ścieżkę, rzekę, most, bramę, drzewa, głazy, kwiaty, budynki, znaki
  minigier, a od wersji 95 także suche drzewka do ścięcia i plac budowy domku na drzewie).
  Scena (źródła: `frontend/scena-3d-src/`) czyta mapę z `globalThis.__SCENA3D_MAPA`.
  Tu tę mapę rysujemy i zapisujemy z powrotem.

  Dlaczego plan 2D, a nie klikanie w 3D: świat jest KULĄ, ale cała logika gry
  liczy się na jej płaskim rozwinięciu ze środka mapy (rzut azymutalny
  równoodległościowy — patrz `scena-3d-src/src/planeta.js`). Pozycja to więc
  dalej para liczb X/Z (teren ma stałą wysokość 0, wystaje tylko most). Rzut z góry
  daje precyzję co do dziesiątej części metra i nie wymaga wciągania three.js
  do narzędzia. Podgląd 3D siedzi obok w iframe i czyta wersję roboczą
  z localStorage — dlatego zmiany widać bez zapisywania pliku.

  Plik leży w `public/`, więc NIE wchodzi do builda aplikacji dziecka.
  Adres: /scena-3d/edytor.html
-->
<style>
  :root{
    --papier:#FBF1D6; --atrament:#4e4d76; --atrament2:#5A4F77;
    --magia:#7A4DC2; --magia2:#B886E8; --czerwien:#C4553F;
    --panel:#fffdf6; --kant:rgba(78,77,118,.16);
  }
  *{box-sizing:border-box}
  body{
    margin:0; height:100vh; display:grid; grid-template-rows:auto 1fr;
    font:14px/1.4 'Nunito',system-ui,sans-serif; color:var(--atrament);
    background:linear-gradient(180deg,#FDF7E7,#F1E4C4); overflow:hidden;
  }
  header{
    display:flex; align-items:center; gap:8px; padding:8px 14px;
    background:var(--panel); border-bottom:1px solid var(--kant); flex-wrap:wrap;
  }
  header h1{font-size:16px; margin:0 12px 0 0; font-weight:900}
  header .info{margin-left:auto; font-size:12px; color:var(--atrament2)}
  button, select, input{font:inherit; color:var(--atrament)}
  button{border:1px solid var(--kant); background:#fff; border-radius:9px;
         padding:6px 11px; cursor:pointer; font-weight:700}
  button:hover{background:#F7F0DC}
  button.glowny{background:linear-gradient(180deg,#C8A0F0,#7A4DC2); color:#fff; border-color:#5b3795}
  button.wybrany{background:linear-gradient(180deg,#FFD269,#E89A3D); border-color:#b47322; color:#4A2A0E}
  button.groza{color:var(--czerwien); margin-top:8px}
  main{display:grid; grid-template-columns:246px 1fr 310px; min-height:0; height:100%}
  /* min-height:0 na kolumnie jest konieczne: bez niego element siatki rozpycha
     wiersz do wysokosci tresci i pasek przewijania nigdy sie nie pojawia. */
  aside{background:var(--panel); overflow-y:auto; overflow-x:hidden; min-height:0; height:100%; padding:12px}
  aside.lewy{border-right:1px solid var(--kant)}
  aside.prawy{border-left:1px solid var(--kant)}
  h2{font-size:11px; text-transform:uppercase; letter-spacing:.8px; color:var(--atrament2); margin:14px 0 6px}
  h2:first-child{margin-top:0}
  .narzedzia{display:grid; grid-template-columns:1fr 1fr; gap:6px}
  .narzedzia button{padding:8px 6px; font-size:12.5px}
  #plansza{position:relative; min-width:0; display:flex}
  svg{width:100%; height:100%; touch-action:none; cursor:crosshair; user-select:none; -webkit-user-select:none;
      background:radial-gradient(circle at 50% 45%, #F7EFD8 0%, #EADFBC 70%, #E0D3AC 100%)}
  .lista{display:flex; flex-direction:column; gap:3px}
  .lista button{text-align:left; font-weight:600; font-size:12.5px; padding:5px 8px; display:flex; gap:6px}
  .lista button.akt{background:#EFE3FA; border-color:var(--magia2)}
  .lista .grupa{display:flex; gap:3px}
  .lista .grupa .nazwa{flex:1}
  .lista .grupa .oko{flex:none; font-size:11px; font-weight:800; color:var(--atrament2); padding:5px 7px}
  .lista .podgrupa{margin-left:12px; border-left:2px solid var(--kant); padding-left:6px;
    display:flex; flex-direction:column; gap:3px}
  .lista .znacznik{width:9px; height:9px; border-radius:50%; align-self:center; flex:none}
  .pole{display:grid; grid-template-columns:80px 1fr; gap:6px; align-items:center; margin-bottom:6px}
  .pole label{font-size:11.5px; color:var(--atrament2); font-weight:700}
  .pole input, .pole select{width:100%; padding:4px 6px; border:1px solid var(--kant); border-radius:7px; background:#fff}
  .para2{display:grid; grid-template-columns:1fr 1fr; gap:4px}
  .podpowiedz{font-size:11.5px; color:var(--atrament2); background:#F6EFDA; border-radius:8px; padding:7px 9px; margin-top:8px}
  #podglad{border-radius:12px; overflow:hidden; background:#1B1338; border:1px solid var(--kant)}
  #podglad iframe{display:block; width:100%; height:360px; border:0; background:#1B1338}
  #podglad .pasek{display:flex; gap:8px; align-items:center; padding:6px 8px; background:#fff}
  #podglad .pasek a{font-size:12px; font-weight:800; color:var(--magia); text-decoration:none}
  #podglad .pasek a:hover{text-decoration:underline}
  #stan-podgladu{padding:5px 8px; font-size:11.5px; font-weight:700; color:#fff; background:#2b2350}
  #stan-podgladu.ok{background:#2F5841}
  #stan-podgladu.zle{background:#7d2f2f}
  .pusty{color:var(--atrament2); font-size:12.5px}
  .suwak{display:grid; grid-template-columns:1fr 58px; gap:6px; align-items:center}
  .suwak input[type=range]{width:100%; accent-color:var(--magia)}
  .przyciski-rzad{display:flex; gap:6px; flex-wrap:wrap; margin:6px 0}
  .przyciski-rzad button{flex:1; font-size:12px; padding:5px 6px}
  .auto{display:flex; align-items:center; gap:6px; font-size:12px; font-weight:700; color:var(--atrament2)}
  /* Plakietka z nazwa otwartego pliku. Edytor dlugo umial tylko `mapa.json`,
     wiec nikt nie pytal, ktory swiat ma na ekranie; przy kilku mapach to
     pierwsza rzecz, ktora trzeba widziec bez klikania. */
  .plik-mapy{font-weight:800; font-size:12px; color:var(--magia); background:#EFE3FA;
    border:1px solid rgba(122,77,194,.35); border-radius:999px; padding:5px 10px; white-space:nowrap}
  svg.lapa{cursor:grab}
  svg.lapa-trzyma{cursor:grabbing}
</style>
</head>
<body>

<header>
  <h1>Edytor mapy</h1>
  <span class="plik-mapy" id="plik-mapy" title="Inna mape otwierasz adresem ?mapa=w2"></span>
  <button id="btn-cofnij" title="Ctrl+Z">Cofnij</button>
  <button id="btn-widok" title="Wróć do widoku całej mapy">Dopasuj widok</button>
  <button id="btn-plik">Wczytaj plik…</button>
  <button id="btn-oryginal">Wczytaj z serwera</button>
  <button id="btn-zapisz" class="glowny">Zapisz w projekcie</button>
  <label class="auto"><input type="checkbox" id="auto"> auto</label>
  <button id="btn-pobierz">Pobierz plik</button>
  <button id="btn-model" title="Wgraj własny model .glb do public/scena-3d/assets/">Wgraj model 3D…</button>
  <input type="file" id="plik" accept="application/json" hidden>
  <input type="file" id="plik-model" accept=".glb" multiple hidden>
  <span class="info" id="info">—</span>
</header>

<main>
  <aside class="lewy">
    <h2>Narzędzie</h2>
    <div class="narzedzia" id="narzedzia"></div>
    <h2>Model do postawienia</h2>
    <select id="model"></select>
    <div class="podpowiedz" id="podpowiedz-narzedzia"></div>
    <div class="podpowiedz">Widok: kółko myszy przybliża, <b>prawy przycisk</b> (albo spacja) przesuwa mapę, „Dopasuj widok” wraca do całości.</div>

    <h2>Na mapie</h2>
    <div class="lista" id="lista"></div>
  </aside>

  <section id="plansza">
    <svg id="plan" viewBox="-19 -19 38 38" preserveAspectRatio="xMidYMid meet"></svg>
  </section>

  <aside class="prawy">
    <h2>Podgląd 3D</h2>
    <div id="podglad">
      <iframe id="ramka" src="about:blank" title="Podgląd sceny"></iframe>
      <div id="stan-podgladu">czekam na scenę…</div>
      <div class="pasek">
        <button id="btn-odswiez">Odśwież</button>
        <a id="link-podglad" href="index.html?panel=0&amp;mapa=podglad" target="_blank" rel="noopener">Otwórz w karcie</a>
      </div>
    </div>

    <h2>Właściwości</h2>
    <div id="wlasciwosci"><p class="pusty">Kliknij coś na mapie.</p></div>
  </aside>
</main>

<script>
/* ── Model danych ─────────────────────────────────────────────────────────
   `mapa` ma dokładnie kształt pliku `mapa.json`, który czyta scena. Edytor nie
   trzyma własnej reprezentacji — dzięki temu „co widzisz, to zapiszesz”, a pola,
   których edytor nie zna, przechodzą przez niego nietknięte.                  */

const KLUCZ = 'scena3d.mapa';
/* KTORA MAPA. `?mapa=w2` otwiera `mapa-w2.json` — ten sam parametr i to samo
   sito [a-z0-9-], co w scenie (`index.html`), zeby adres nie siegnal poza ten
   katalog. Bez parametru zostaje `mapa.json`, czyli pierwszy swiat.

   Wersja robocza w localStorage jest JEDNA, bo podglad 3D czyta ja spod
   sztywnego klucza. Dlatego trzymamy przy niej nazwe pliku: roboczy W2 nie
   otworzy sie jako W1 (i odwrotnie) — inaczej edytor pokazuje jeden swiat,
   a nazwa w naglowku mowi o drugim. */
const NAZWA_MAPY = (new URLSearchParams(location.search).get('mapa') || '')
  .toLowerCase().replace(/[^a-z0-9-]/g, '');
const PLIK_MAPY = NAZWA_MAPY && NAZWA_MAPY !== 'podglad' ? 'mapa-' + NAZWA_MAPY + '.json' : 'mapa.json';
const KLUCZ_PLIKU = KLUCZ + '.plik';

/* GRUPA KWIATOW. Kwiatow jest blisko sto i jako osobne uchwyty zaslanialy caly
   plan, a ich pola trafienia przechwytywaly kliki w to, co pod nimi. Zamknieta
   grupa rysuje je drobno, przygaszone i BEZ pola trafienia; otwarta wraca do
   pelnych uchwytow, wiec kwiat da sie przesunac, przemalowac i skasowac.
   Stan siedzi w localStorage, NIE w mapie — to ustawienie widoku, nie
   wlasciwosc swiata, i nie ma prawa wjechac do pliku. */
const KLUCZ_KWIATOW = 'scena3d.edytor.kwiaty';
const kwiatyGrupa = { pokaz: true, otwarta: false };
try { Object.assign(kwiatyGrupa, JSON.parse(localStorage.getItem(KLUCZ_KWIATOW) || '{}')); } catch (e) { console.warn(e); }
function zapiszUiKwiatow() {
  try { localStorage.setItem(KLUCZ_KWIATOW, JSON.stringify(kwiatyGrupa)); } catch (e) { console.warn(e); }
}
/**
 * MODELE — co da się postawić na mapie.
 *
 * `drzewo` i `drzewo-lisciaste` NIE sa plikami GLB — buduje je generator
 * sceny (patch `loadGLB` w bundlu). Stoja na liscie, bo z punktu widzenia
 * edytora to zwykly model do postawienia pod znakiem.
 *
 * Lista wbudowana jest tylko AWARYJNA: przy `npm run dev` edytor czyta
 * prawdziwą zawartość `public/scena-3d/assets/` z końcówki `/__modele`, więc
 * własny model wgrany przyciskiem „Wgraj model 3D…" pojawia się tu od razu,
 * bez dopisywania czegokolwiek w kodzie.
 */
const MODELE_WBUDOWANE = ['karta','gwiazda','medal','lisc','wizard','drzewo','drzewo-lisciaste','hut2','hut','postac'];
let MODELE = [...MODELE_WBUDOWANE];

let mapa = null;
let wybor = null;            // { typ, idx }
let tryb = 'wybor';
const historia = [];

const $ = (s) => document.querySelector(s);
const plan = $('#plan');
const zaokr = (v) => Math.round(v * 100) / 100;

const TRYBY = [
  { id:'wybor',   nazwa:'Wybierz',   opis:'Klikasz obiekt i przeciągasz po mapie. Delete kasuje, Q/E obracają, [ oraz ] zmieniają skalę, strzałki przesuwają co 10 cm.' },
  { id:'znak',    nazwa:'+ Znak',    opis:'Znak minigry: świeci, dziecko go dotyka, do aplikacji leci zdarzenie. Po postawieniu ustaw etykietę i toast po prawej.' },
  { id:'budynek', nazwa:'+ Budynek', opis:'Model GLB stojący na ziemi. „Kolizja r” to kółko, którego dziecko nie przejdzie — ustaw je mniej więcej na obrys bryły.' },
  { id:'drzewo',  nazwa:'+ Drzewo',  opis:'Drzewo z generatora sceny: sosna albo liściaste. Kolizja stała 0,75.' },
  { id:'glaz',    nazwa:'+ Głaz',    opis:'Głaz z generatora sceny. Kolizja rośnie ze skalą. Zaznacz „do rozbicia”, żeby dziecko mogło go rozbić na kamienie — wtedy głaz potrzebuje też własnego id.' },
  { id:'suche',   nazwa:'+ Suche drzewko', opis:'Uschnięte drzewko do ścięcia — z niego biorą się kłody na domek na drzewie. Ścinamy TYLKO takie: żywy las zostaje. Model z pliku GLB, kolizja mniejsza niż zasięg pracy, żeby lisek zdążył podejść.' },
  { id:'kwiat',   nazwa:'+ Kwiat',   opis:'Kwiat z generatora sceny — pięć odmian koloru. Nie blokuje chodzenia i ugina się, gdy bohater go mija. Wzrost i przechył losuje się z numeru kwiatu, więc po przestawieniu wygląda inaczej.' },
  { id:'oczko',   nazwa:'+ Oczko',   opis:'Staw z ręcznie rysowanym brzegiem. Klikaj punkty obrysu — pierwszy klik zaczyna nowy staw, każdy następny go przedłuża. Ten sam obrys robi nieckę w ziemi, piaskowy brzeg i taflę wody. Lisek nabiera z niego wody i nie tonie: staw nie blokuje chodzenia.' },
  { id:'wzgorze', nazwa:'+ Wzgórze',  opis:'Pagórek z ręcznie rysowanym obrysem. Klikaj punkty, tak samo jak przy oczku. Wysokość ustawiasz po prawej — powyżej 0,9 teren zaczyna zasłaniać liska przy tej kamerze, więc edytor ostrzeże.' },
  { id:'sciezka', nazwa:'Ścieżka',   opis:'Klik dokłada punkt na końcu ścieżki, klik w punkt zaznacza go, przeciąganie przesuwa. Ścieżka to trasa spaceru i rysunek na trawie — nie blokuje chodzenia.' },
  { id:'galaz',   nazwa:'+ Gałąź',   opis:'Odnoga od głównej ścieżki. Pierwszy klik zaczyna gałąź w najbliższym węźle ścieżki, każdy następny ją przedłuża. Gałąź trzyma się swojego węzła — przesuniesz ścieżkę, przesunie się razem z nią. To sam rysunek na trawie: nie blokuje chodzenia i nie zmienia trasy bohatera.' },
];

function rysujNarzedzia() {
  $('#narzedzia').innerHTML = '';
  for (const t of TRYBY) {
    const b = document.createElement('button');
    b.textContent = t.nazwa;
    b.className = t.id === tryb ? 'wybrany' : '';
    b.onclick = () => { tryb = t.id; rysujNarzedzia(); };
    $('#narzedzia').appendChild(b);
  }
  $('#podpowiedz-narzedzia').textContent = TRYBY.find((t) => t.id === tryb).opis;
}

/* ── Wczytanie i zapis ───────────────────────────────────────────────────── */
async function wczytaj({ zSerwera = false } = {}) {
  if (!zSerwera) {
    try {
      const robocza = localStorage.getItem(KLUCZ);
      const zPliku = localStorage.getItem(KLUCZ_PLIKU) || 'mapa.json';
      if (robocza && zPliku === PLIK_MAPY) {
        ustaw(JSON.parse(robocza), 'wersja robocza z tej przeglądarki · ' + PLIK_MAPY);
        return;
      }
    } catch (e) { console.warn(e); }
  }
  const odp = await fetch(PLIK_MAPY, { cache: 'no-cache' });
  ustaw(await odp.json(), PLIK_MAPY + ' z serwera');
}

function ustaw(m, skad) {
  mapa = m;
  zapewnijStart();
  zapewnijWezly();
  przeliczSciezke();
  wybor = null;
  historia.length = 0;
  $('#info').textContent = skad;
  zapisz({ bezHistorii: true });
  rysuj();
  odswiezPodglad();
}

function zapisz({ bezHistorii = false } = {}) {
  if (!bezHistorii) {
    historia.push(JSON.stringify(mapa));
    if (historia.length > 60) historia.shift();
  }
  try {
    localStorage.setItem(KLUCZ, JSON.stringify(mapa));
    localStorage.setItem(KLUCZ_PLIKU, PLIK_MAPY);
  } catch (e) { console.warn(e); }
  autozapis();
}

function cofnij() {
  if (historia.length < 2) return;
  historia.pop();
  mapa = JSON.parse(historia[historia.length - 1]);
  wybor = null;
  zapisz({ bezHistorii: true });
  rysuj();
}

function pobierz() {
  const blob = new Blob([JSON.stringify(mapa, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = PLIK_MAPY;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/**
 * Zapis do projektu. Strona w `public/` nie ma dostepu do dysku, wiec plik
 * zapisuje serwer deweloperski: koncowka `POST /__mapa` z `vite.config.js`.
 * Poza `npm run dev` to nie zadziala — i dobrze, bo na produkcji nikt nie ma
 * prawa przestawiac mapy przez HTTP. Wtedy zostaje „Pobierz plik".
 */
async function zapiszWProjekcie({ cicho = false } = {}) {
  try {
    const odp = await fetch('/__mapa?plik=' + encodeURIComponent(PLIK_MAPY), {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(mapa),
    });
    const dane = await odp.json();
    $('#info').textContent = dane.ok
      ? 'zapisane → public/scena-3d/' + PLIK_MAPY + '  (' + new Date().toLocaleTimeString('pl') + ')'
      : 'błąd zapisu: ' + dane.blad;
    return dane.ok;
  } catch (e) {
    $('#info').textContent = cicho ? 'autozapis nieczynny (uruchom npm run dev)'
                                   : 'zapis działa tylko przy npm run dev — użyj „Pobierz plik"';
    return false;
  }
}

let autozapisCzeka = null;
function autozapis() {
  if (!$('#auto').checked) return;
  clearTimeout(autozapisCzeka);
  autozapisCzeka = setTimeout(() => zapiszWProjekcie({ cicho: true }), 1200);
}

function odswiezPodglad() {
  // iframe czyta wersję roboczą z localStorage — patrz index.html, gałąź ?mapa=podglad
  stanPodgladu('wczytuję scenę…', '');
  $('#ramka').src = 'index.html?panel=0&mapa=podglad&t=' + Date.now();
}

function stanPodgladu(tekst, klasa) {
  const e = $('#stan-podgladu');
  e.textContent = tekst;
  e.className = klasa;
}

/**
 * Moduł sceny, gdy siedzi w iframe, melduje o sobie przez `postMessage`
 * (`{ scena3d:'zdarzenie', nazwa:'gotowa' | 'blad' }`). Bez tego czarny
 * prostokąt w podglądzie znaczy jednocześnie „wczytuję", „nie mam WebGL"
 * i „wywaliłem się" — a to trzy różne rzeczy do zrobienia.
 */
window.addEventListener('message', (ev) => {
  const d = ev.data;
  if (!d || d.scena3d !== 'zdarzenie') return;
  if (d.nazwa === 'gotowa') stanPodgladu('scena wczytana', 'ok');
  else if (d.nazwa === 'blad') stanPodgladu('błąd sceny: ' + (d.dane?.komunikat || 'sprawdź konsolę'), 'zle');
});

/* ── Ścieżka: węzły, łuki, próbkowanie ────────────────────────────────────
   Scena czyta ze `sciezka` zwykłą ŁAMANĄ — nie zna splajnów i nie da się jej
   tego nauczyć bez źródeł modułu. Łuki robimy więc po naszej stronie: edytor
   trzyma garść WĘZŁÓW (`sciezkaWezly`), a przy każdej zmianie wypala z nich
   gęstą łamaną do `sciezka`. Scena dostaje to, co rozumie, a Ty ciągniesz kilka
   punktów zamiast trzydziestu.

   `gladkosc` miesza między odcinkiem prostym (0) a splajnem Catmulla-Roma (1),
   więc suwak przechodzi płynnie od ostrych kantów do zaokrąglonych łuków.
   `probki` mówi, na ile kawałków ciąć każdy odcinek — im więcej, tym gładszy
   łuk i tym dłuższa tablica w pliku.                                         */

/* Mapy sprzed wprowadzenia startu nie maja tego pola. Dopisujemy je na
   pierwszym wolnym punkcie sciezki - czyli tam, gdzie bohater i tak stawal -
   ale juz jako OSOBNA wartosc, ktorej przerysowanie sciezki nie rusza. */
function zapewnijStart() {
  if (mapa.start?.pos) return;
  const s = mapa.sciezka || [];
  const r = (mapa.swiat?.promien ?? 14) - 0.7;
  const p = s.find((q) => Math.hypot(q[0], q[1]) <= r) || s[0] || [0, 0];
  const i = s.indexOf(p);
  const dalej = i >= 0 ? s[Math.min(i + 6, s.length - 1)] : p;
  mapa.start = {
    pos: [p[0], p[1]],
    obrot: Math.round(Math.atan2(dalej[0] - p[0], dalej[1] - p[1]) * 1000) / 1000,
  };
}

function zapewnijWezly() {
  if (!mapa.sciezkaWezly) {
    mapa.sciezkaWezly = {
      punkty: (mapa.sciezka || []).map((p) => [...p]),
      gladkosc: 0,      // 0 = dokładnie to, co dziś w grze — nic się nie zmienia
      probki: 1,
      wezelLatarni: mapa.latarnia?.punktSciezki ?? 0,
    };
  }
}
const wezly = () => mapa.sciezkaWezly.punkty;

function catmull(p0, p1, p2, p3, u, t) {
  const prosto = [p1[0] + (p2[0] - p1[0]) * u, p1[1] + (p2[1] - p1[1]) * u];
  if (!t) return prosto;
  const u2 = u * u, u3 = u2 * u;
  const cr = (a, b, c, d) => .5 * (2 * b + (-a + c) * u + (2 * a - 5 * b + 4 * c - d) * u2 + (-a + 3 * b - 3 * c + d) * u3);
  const splajn = [cr(p0[0], p1[0], p2[0], p3[0]), cr(p0[1], p1[1], p2[1], p3[1])];
  return [prosto[0] + (splajn[0] - prosto[0]) * t, prosto[1] + (splajn[1] - prosto[1]) * t];
}

/** Węzły → gęsta łamana. Ta sama matematyka dla ścieżki i dla każdej gałęzi. */
function wypal(P, gladkosc, probki) {
  const n = Math.max(1, Math.round(probki || 1));
  if (!P || P.length < 2) return (P || []).map((p) => [zaokr(p[0]), zaokr(p[1])]);
  const wez = (i) => P[Math.max(0, Math.min(P.length - 1, i))];
  const out = [];
  for (let i = 0; i < P.length - 1; i++)
    for (let s = 0; s < n; s++)
      out.push(catmull(wez(i - 1), wez(i), wez(i + 1), wez(i + 2), s / n, gladkosc || 0));
  out.push([...P[P.length - 1]]);
  return out.map((p) => [zaokr(p[0]), zaokr(p[1])]);
}

function przeliczSciezke() {
  zapewnijWezly();
  const w = mapa.sciezkaWezly;
  const P = w.punkty;
  const probki = Math.max(1, Math.round(w.probki || 1));
  if (P.length < 2) { mapa.sciezka = P.map((p) => [...p]); przeliczGalezie(); return; }
  mapa.sciezka = wypal(P, w.gladkosc, probki);
  przeliczGalezie();

  // Latarnia wskazuje INDEKS w wypalonej łamanej, więc po każdym przeliczeniu
  // trzeba go przeliczyć z numeru węzła — inaczej bohater szedłby w inne miejsce.
  if (mapa.latarnia)
    mapa.latarnia.punktSciezki = Math.min(mapa.sciezka.length - 1,
      Math.max(0, Math.round((w.wezelLatarni ?? 0) * probki)));
}

/* ── Gałęzie ścieżki ──────────────────────────────────────────────────────
   Gałąź to odnoga rysowana na trawie: własne węzły, własny łuk, własna
   szerokość. Trasa bohatera, latarnia i most czytają WYŁĄCZNIE główną
   `sciezka` — gałęzie ich nie dotykają, więc dorysowanie odnogi nie może
   zepsuć chodzenia ani ustawienia mostu.

   PIERWSZY WĘZEŁ GAŁĘZI NIE JEST SWÓJ — to kopia węzła głównej ścieżki
   (`od`). Trzymamy indeks, nie współrzędne: gdy przesuniesz ścieżkę, gałąź
   idzie razem z nią i nigdy nie zostaje wisieć w powietrzu.

   Scena dostaje wypaloną łamaną w `galezie[].sciezka` — tak samo, jak dostaje
   `sciezka` — bo nie zna splajnów i nie da się jej tego nauczyć bez źródeł. */
function zapewnijGalezie() {
  if (!Array.isArray(mapa.galezie)) mapa.galezie = [];
  return mapa.galezie;
}

/** Węzeł głównej ścieżki najbliższy punktowi (x, z) — początek nowej gałęzi. */
function najblizszyWezel(x, z) {
  const W = wezly();
  let naj = 0, ile = Infinity;
  W.forEach((p, i) => {
    const d = (p[0] - x) ** 2 + (p[1] - z) ** 2;
    if (d < ile) { ile = d; naj = i; }
  });
  return naj;
}

function przeliczGalezie() {
  for (const g of zapewnijGalezie()) {
    const W = wezly();
    const kotwica = W[Math.max(0, Math.min(W.length - 1, g.od ?? 0))];
    if (!Array.isArray(g.punkty) || !g.punkty.length) g.punkty = [[...(kotwica || [0, 0])]];
    if (kotwica) g.punkty[0] = [...kotwica];
    g.sciezka = wypal(g.punkty, g.gladkosc ?? .6, g.probki ?? 8);
  }
}

/* ── Geometria ───────────────────────────────────────────────────────────── */
function bezier(a, b, c, t) {
  const u = 1 - t;
  return [u*u*a[0] + 2*u*t*b[0] + t*t*c[0], u*u*a[1] + 2*u*t*b[1] + t*t*c[1]];
}
function punktyRzeki() {
  const out = [];
  (mapa.rzeka?.krzywe || []).forEach((k, ki) => {
    const n = k.kroki || 12;
    for (let i = (ki ? 1 : 0); i <= n; i++) out.push(bezier(k.od, k.kontrola, k.do, i / n));
  });
  return out;
}

/* ── Rysowanie planu ─────────────────────────────────────────────────────── */
const NS = 'http://www.w3.org/2000/svg';
function el(nazwa, atrybuty) {
  const e = document.createElementNS(NS, nazwa);
  // Atrybut o wartości null/undefined jest POMIJANY, a nie wpisywany jako
  // tekst "null" — dzięki temu da się pisać `stroke-dasharray: warunek ? '…' : null`
  // zamiast budować obiekt atrybutów w dwóch wariantach.
  for (const [k, v] of Object.entries(atrybuty || {})) if (v != null) e.setAttribute(k, v);
  plan.appendChild(e);
  return e;
}

function uchwyt(typ, idx, e) {
  e.dataset.typ = typ;
  e.dataset.idx = idx;
  e.style.cursor = 'grab';
  if (wybor && wybor.typ === typ && String(wybor.idx) === String(idx)) {
    e.setAttribute('stroke', '#7A4DC2');
    e.setAttribute('stroke-width', '.16');
  }
  return e;
}

/** Środek ciężkości obrysu — DOKŁADNIE ten sam wzór co `srodekObrysu`
 *  w `scena-3d-src/src/teren.js`. Gdyby się rozjechały, podpis i uchwyt
 *  na planie stanęłyby gdzie indziej niż niecka w scenie. */
function srodekObrysu(punkty) {
  let x = 0, z = 0;
  for (const q of punkty) { x += q[0]; z += q[1]; }
  return [x / punkty.length, z / punkty.length];
}
/* ZAOKRĄGLANIE NAROŻNIKÓW OBRYSU — kopia `wygladzObrys` ze `scena-3d-src/src/
   teren.js`, tylko oparta o tutejszy `catmull()` (ten sam wzór). Klikane punkty
   to WĘZŁY: krzywa przechodzi dokładnie przez nie, a wygładza to, co pomiędzy.
   Różnica wobec ścieżki: indeksy ZAWIJAJĄ SIĘ dookoła zamiast przycinać na
   końcach, bo staw jest zamknięty i ostatni odcinek wraca do pierwszego punktu.

   Te dwie kopie MUSZĄ liczyć tak samo — inaczej plan pokazuje inny brzeg,
   niż wychodzi w scenie. Zmieniasz tu, zmieniasz i tam. */
const OBRYS_GLADKOSC = .7, OBRYS_PROBKI = 6;
function wygladzObrys(P, gladkosc = OBRYS_GLADKOSC, probki = OBRYS_PROBKI) {
  if (!Array.isArray(P) || P.length < 3 || !(gladkosc > 0)) return (P || []).map((q) => [q[0], q[1]]);
  const n = P.length;
  const wez = (i) => P[((i % n) + n) % n];
  const kr = Math.max(1, Math.round(probki));
  const out = [];
  for (let i = 0; i < n; i++)
    for (let sI = 0; sI < kr; sI++)
      out.push(catmull(wez(i - 1), wez(i), wez(i + 1), wez(i + 2), sI / kr, gladkosc));
  return out;
}

const oczkaPary = () => (mapa.oczka || []).map((k, gi) => ({ k, gi }));
const wzgorzaPary = () => (mapa.formyTerenu || [])
  .map((k, gi) => ({ k, gi })).filter(({ k }) => k.typ === 'wzgorze' && Array.isArray(k.punkty));

function rysuj() {
  plan.innerHTML = '';
  if (!mapa) return;
  const promien = mapa.swiat?.promien ?? 12.5;

  /* ── CAŁA PLANETA, nie kwadrat ────────────────────────────────────────────
     Świat jest KULĄ o promieniu `promienKuli` (R). Plan to jej rozwinięcie ze
     środka mapy (rzut azymutalny równoodległościowy), więc punkt oddalony
     o `r` leży `r/R` radianów od środka. Z tego wynikają trzy prawdziwe
     granice — i żadna z nich nie jest kwadratem 40×40, który tu stał wcześniej:

       90°  = πR/2   „równik" widziany ze środka mapy; dalej jest druga
                     półkula — ta, na której akurat wypada noc
       ~130° = promienTresci  dokąd scena ciągnie ŚCIEŻKĘ i RZEKĘ; dalej rzut
                     rozmazuje długie linie w wachlarz, więc są przycinane
       180° = πR     antypod: cały ten okrąg to JEDEN punkt na kuli

     Obiekty (drzewa, głazy, budynki, znaki, plac budowy) NIE mają żadnego
     z tych limitów — stoją wszędzie, bo każdy dostaje własną ramkę na kuli.
     Bohater też chodzi po całej planecie; jedyny płot to `swiat.tylkoMapa`. */
  const R = mapa.swiat?.promienKuli ?? 8.5;
  const RA = Math.PI * R;                                  // antypod
  const RT = mapa.swiat?.promienTresci ?? .72 * RA;        // ścieżka i rzeka
  const RR = RA / 2;                                       // 90° od środka

  el('circle', { cx:0, cy:0, r:RA, fill:'#DCEBC0', stroke:'#9DB07F', 'stroke-width':.12 });
  // Druga półkula przygaszona: nie jest gorsza, jest po prostu „po drugiej
  // stronie" — i to ona bywa nocą, gdy cykl dnia jest włączony.
  el('path', { d:`M ${-RA} 0 A ${RA} ${RA} 0 1 0 ${RA} 0 A ${RA} ${RA} 0 1 0 ${-RA} 0
                  M ${-RR} 0 A ${RR} ${RR} 0 1 1 ${RR} 0 A ${RR} ${RR} 0 1 1 ${-RR} 0`,
    'fill-rule':'evenodd', fill:'#000', 'fill-opacity':.05, 'pointer-events':'none' });

  const KRAG = Math.ceil(RA);
  for (let i = -KRAG; i <= KRAG; i++) {
    const g = i % 5 === 0 ? .09 : .04;
    el('line', { x1:i, y1:-KRAG, x2:i, y2:KRAG, stroke:'#000', 'stroke-opacity':g, 'stroke-width':.02 });
    el('line', { x1:-KRAG, y1:i, x2:KRAG, y2:i, stroke:'#000', 'stroke-opacity':g, 'stroke-width':.02 });
  }

  const krag = (r, kolor, tekst, przerywana) => {
    el('circle', { cx:0, cy:0, r, fill:'none', stroke:kolor, 'stroke-width':.1,
      'stroke-dasharray': przerywana || '', 'pointer-events':'none' });
    el('text', { x:0, y:-r + .62, 'font-size':.52, 'text-anchor':'middle', fill:kolor,
      'pointer-events':'none', stroke:'#DCEBC0', 'stroke-width':.18, 'paint-order':'stroke',
      'font-weight':'700' }).textContent = tekst;
  };
  krag(RR, '#7f9464', '90° — dalej druga półkula', '.6 .4');
  krag(RT, '#9a7a3c', 'koniec ścieżki i rzeki (~130°)', '.5 .35');
  krag(RA, '#9a5a4c', 'antypod — tu rzut zwija się w punkt', '.35 .3');
  /* Okrąg `swiat.promien` zostaje, ale w roli, którą naprawdę pełni: to płot
     dla bohatera TYLKO przy `swiat.tylkoMapa`, a poza tym sama kreska. Kiedyś
     był tu jedynym okręgiem na planie i dlatego wyglądał jak krawędź świata —
     przy R=8,5 obejmuje 54 % powierzchni kuli. */
  const jestPlot = !!mapa.swiat?.tylkoMapa;
  el('circle', { cx:0, cy:0, r:promien, fill:'none', stroke: jestPlot ? '#C4553F' : '#B7C79A',
    'stroke-width': jestPlot ? .14 : .07, 'stroke-dasharray':'.5 .35', 'pointer-events':'none' });
  if (jestPlot)
    el('text', { x:0, y:promien - .5, 'font-size':.5, 'text-anchor':'middle', fill:'#C4553F',
      'pointer-events':'none', stroke:'#DCEBC0', 'stroke-width':.18, 'paint-order':'stroke',
      'font-weight':'700' }).textContent = 'płot: „tylko mapa”';
  el('text', { x:.15, y:-.15, 'font-size':.5, fill:'#4e4d76', 'fill-opacity':.5 }).textContent = '0,0';

  const rz = punktyRzeki();
  if (rz.length > 1) el('polyline', {
    points: rz.map((p) => p.join(',')).join(' '), fill:'none', stroke:'#8FCBE8',
    'stroke-width': (mapa.rzeka?.szerokosc ?? 1.5) * 2, 'stroke-linecap':'round',
    'stroke-linejoin':'round', 'stroke-opacity':.85 });

  (mapa.rzeka?.krzywe || []).forEach((k, i) => {
    el('polyline', { points: `${k.od.join(',')} ${k.kontrola.join(',')} ${k.do.join(',')}`,
      fill:'none', stroke:'#2E7AB8', 'stroke-opacity':.4, 'stroke-width':.05, 'stroke-dasharray':'.25 .2' });
    ['od','kontrola','do'].forEach((rola) => {
      const p = k[rola];
      uchwyt('rzeka', i + ':' + rola, el('circle', {
        cx:p[0], cy:p[1], r: rola === 'kontrola' ? .2 : .26,
        fill: rola === 'kontrola' ? '#fff' : '#2E7AB8', stroke:'#2E7AB8', 'stroke-width':.07 }));
    });
  });

  const sc = mapa.sciezka || [];
  if (sc.length > 1) el('polyline', { points: sc.map((p) => p.join(',')).join(' '), fill:'none',
    stroke:'#D9BE86', 'stroke-width':.75, 'stroke-linecap':'round', 'stroke-linejoin':'round' });

  // Cienka linia łącząca węzły pokazuje, co właściwie ciągniesz — przy dużej
  // gładkości wstęga potrafi odejść od węzłów o pół metra.
  const W = wezly();
  if (W.length > 1 && (mapa.sciezkaWezly.gladkosc || 0) > 0)
    el('polyline', { points: W.map((p) => p.join(',')).join(' '), fill:'none',
      stroke:'#7A4DC2', 'stroke-opacity':.35, 'stroke-width':.05, 'stroke-dasharray':'.25 .2' });
  W.forEach((p, i) => uchwyt('sciezka', i, el('circle', {
    cx:p[0], cy:p[1], r:.24, fill:'#B98F4A', stroke:'#fff', 'stroke-width':.07 })));

  // Gałęzie: wypalona wstęga (to, co zobaczysz w scenie) + węzły do ciągnięcia.
  // Kotwica (węzeł 0) jest KWADRATEM i nie ma uchwytu — siedzi na ścieżce
  // i przesuwa się razem z nią, więc ciągnięcie jej osobno tylko myliłoby.
  zapewnijGalezie().forEach((g, gi) => {
    const linia = g.sciezka || [];
    if (linia.length > 1) el('polyline', { points: linia.map((p) => p.join(',')).join(' '),
      fill:'none', stroke:'#CDA96F', 'stroke-width': .55 * (g.szerokosc ?? .75),
      'stroke-linecap':'round', 'stroke-linejoin':'round' });
    (g.punkty || []).forEach((p, i) => {
      if (i === 0) {
        el('rect', { x:p[0] - .17, y:p[1] - .17, width:.34, height:.34, rx:.06,
          fill:'#7A4DC2', stroke:'#fff', 'stroke-width':.06 });
        return;
      }
      uchwyt('galaz', gi + ':' + i, el('circle', {
        cx:p[0], cy:p[1], r:.2, fill:'#E0C08A', stroke:'#7A4DC2', 'stroke-width':.06 }));
    });
  });

  if (tryb === 'sciezka') {
    // plusik na środku każdego odcinka = wstaw wierzchołek, plusik za końcami = przedłuż
    const plus = (x, z, gdzie) => {
      const g = el('g', {});
      const k = document.createElementNS(NS, 'circle');
      k.setAttribute('cx', x); k.setAttribute('cy', z); k.setAttribute('r', .28);
      k.setAttribute('fill', '#fff'); k.setAttribute('stroke', '#7A4DC2'); k.setAttribute('stroke-width', .07);
      const l1 = document.createElementNS(NS, 'path');
      l1.setAttribute('d', `M${x - .14},${z} H${x + .14} M${x},${z - .14} V${z + .14}`);
      l1.setAttribute('stroke', '#7A4DC2'); l1.setAttribute('stroke-width', .09);
      // Klik trafia w KÓŁKO, nie w grupę — grupa sama z siebie nie ma pola
      // trafienia, a krzyżyk musi być przezroczysty dla myszy, żeby dziura
      // w środku plusika nie przepuszczała kliknięcia na tło.
      k.dataset.typ = 'wstaw-sciezke';
      k.dataset.idx = gdzie;
      k.style.cursor = 'copy';
      l1.style.pointerEvents = 'none';
      g.append(k, l1);
    };
    for (let i = 0; i < W.length - 1; i++)
      plus((W[i][0] + W[i + 1][0]) / 2, (W[i][1] + W[i + 1][1]) / 2, i + 1);
    if (W.length > 1) {
      const a = W[0], b = W[1], c = W[W.length - 2], d = W[W.length - 1];
      plus(a[0] + (a[0] - b[0]), a[1] + (a[1] - b[1]), 0);
      plus(d[0] + (d[0] - c[0]), d[1] + (d[1] - c[1]), W.length);
    }
  }

  if (mapa.most) {
    const p = mapa.most.pos, a = sc[1], b = sc[2];
    const kat = a && b ? Math.atan2(b[0]-a[0], b[1]-a[1]) * 180 / Math.PI : 0;
    /* Most i brama bywaja WYLACZONE z mapy (`ukryty` / `ukryta`) — tak stoi
       swiat W2, ktory nie ma ani rzeki, ani bramy. Rysowane pelna barwa
       siedzialy wtedy na srodku planu jak prawdziwe przeszkody i zaslanialy
       to, co naprawde jest w swiecie. Pokazujemy je wiec tak, jak zgaszona
       latarnie: przerywanym obrysem, bez wypelnienia — dalej klikalne, wiec
       da sie je wlaczyc z powrotem. */
    const mostSchowany = !!mapa.most.ukryty;
    uchwyt('most', 0, el('rect', { x:p[0]-1, y:p[1]-2.1, width:2, height:4.2, rx:.2,
      fill: mostSchowany ? 'none' : '#C9A06A',
      stroke: mostSchowany ? '#9c8a63' : '#8a6636', 'stroke-width':.06,
      'stroke-dasharray': mostSchowany ? '.22 .18' : null,
      opacity: mostSchowany ? .5 : 1,
      transform:`rotate(${-kat} ${p[0]} ${p[1]})` }));
  }
  if (mapa.brama) {
    const p = mapa.brama.pos;
    const bramaSchowana = !!mapa.brama.ukryta;
    uchwyt('brama', 0, el('rect', { x:p[0]-1.6, y:p[1]-.35, width:3.2, height:.7, rx:.25,
      fill: bramaSchowana ? 'none' : '#B58A5B',
      stroke: bramaSchowana ? '#9c8a63' : '#7a5734', 'stroke-width':.06,
      'stroke-dasharray': bramaSchowana ? '.22 .18' : null,
      opacity: bramaSchowana ? .5 : 1 }));
  }
  if (mapa.latarnia) {
    const p = mapa.latarnia.pos;
    /* Ukryta latarnia zostaje na mapie jako PUSTE, przerywane kółko: nie ma jej
       w scenie, ale musi dać się kliknąć i przywrócić. Znikający uchwyt
       zamieniłby ukrycie w operację bez powrotu — jedyną drogą z powrotem
       byłoby ręczne grzebanie w `mapa.json`. */
    const zgaszona = !!mapa.latarnia.ukryta;
    uchwyt('latarnia', 0, el('circle', {
      cx:p[0], cy:p[1], r:.42,
      fill: zgaszona ? 'none' : '#FFE08A',
      stroke: zgaszona ? '#9c8a63' : '#C9922E',
      'stroke-width': .09,
      'stroke-dasharray': zgaszona ? '.22 .18' : null,
      opacity: zgaszona ? .55 : 1,
    }));
  }

  /* START LISKA. Osobny punkt, nie pierwszy wezel sciezki: sciezke rysuje sie
     i przerysowuje bez konca, a spawn ma zostac tam, gdzie go postawiono.
     Rysujemy kolko z dziobem pokazujacym, w ktora strone lisek patrzy - to
     jedyne miejsce, w ktorym ten kat w ogole widac. */
  if (mapa.start) {
    const p = mapa.start.pos;
    const k = mapa.start.obrot ?? 0;
    el('line', { x1:p[0], y1:p[1], x2:p[0] + Math.sin(k) * 1.15, y2:p[1] + Math.cos(k) * 1.15,
      stroke:'#E07A2F', 'stroke-width':.12, 'stroke-linecap':'round' });
    uchwyt('start', 0, el('circle', {
      cx:p[0], cy:p[1], r:.5,
      fill:'#F09A44', stroke:'#8a4a12', 'stroke-width':.11,
    }));
  }

  const kreskaObrotu = (o, r, kolor) => {
    const k = o.obrot;
    if (k == null) return;
    el('line', { x1:o.pos[0], y1:o.pos[1], x2:o.pos[0] + Math.sin(k) * r, y2:o.pos[1] + Math.cos(k) * r,
      stroke:kolor, 'stroke-width':.09, 'stroke-linecap':'round' });
  };
  /* OCZKA I WZGÓRZA — deformacje terenu. Rysujemy je NAJPIERW, bo leżą
     w ziemi: drzewo stojące nad stawem ma być widoczne, a nie przykryte
     niebieską plamą. Obrys jest tym, co narysowano — bez wygładzania, żeby
     na planie było widać dokładnie te punkty, które trafią do pliku. */
  const obrysSVG = (pk) => pk.map((q) => q.join(',')).join(' ');
  const rysujObrys = (pary, typ, wypelnienie, kant, podpis) => {
    pary.forEach(({ k, gi }) => {
      if (!Array.isArray(k.punkty) || k.punkty.length < 2) return;
      const wybrany = wybor && wybor.typ === typ && String(wybor.idx).split(':')[0] === String(gi);
      /* Rysujemy KRZYWĄ, nie łamaną — to samo, co zobaczysz w scenie. Uchwyty
         zostają na punktach klikanych, więc widać i kształt, i czym się go
         przesuwa. */
      const krzywa = k.punkty.length >= 3
        ? wygladzObrys(k.punkty, k.gladkosc ?? OBRYS_GLADKOSC, k.probki ?? OBRYS_PROBKI)
        : k.punkty;
      const wielobok = el(k.punkty.length >= 3 ? 'polygon' : 'polyline', {
        points: obrysSVG(krzywa), fill: k.punkty.length >= 3 ? wypelnienie : 'none',
        'fill-opacity': wybrany ? .78 : .55, stroke:kant, 'stroke-width': wybrany ? .14 : .09,
        'stroke-linejoin':'round' });
      wielobok.dataset.typ = typ + '-ksztalt';
      wielobok.dataset.idx = String(gi);
      wielobok.style.cursor = 'grab';
      // Uchwyty wierzchołków TYLKO na zaznaczonym kształcie: przy kilku stawach
      // setka kropek zasłoniłaby mapę i łapała każde kliknięcie w teren.
      if (wybrany) k.punkty.forEach((q, i) => {
        const u = el('circle', { cx:q[0], cy:q[1], r:.2, fill:'#fff', stroke:kant, 'stroke-width':.08 });
        u.dataset.typ = typ;
        u.dataset.idx = gi + ':' + i;
        u.style.cursor = 'grab';
      });
      const sr = srodekObrysu(k.punkty);
      el('text', { x:sr[0], y:sr[1] + .14, 'font-size':.42, 'text-anchor':'middle', fill:kant,
        'pointer-events':'none' }).textContent = podpis(k, gi);
    });
  };
  rysujObrys(oczkaPary(), 'oczko', '#7FD3E8', '#2E7AB8',
    (k) => 'staw ' + (k.glebokosc ?? .11).toFixed(2));
  /* WZGÓRZA siedzą w `formyTerenu` razem z nieckami i wykopami, więc indeks
     musi być TEN Z PLIKU, a nie z przefiltrowanej listy — inaczej skasowanie
     wzgórza usuwałoby przypadkową inną formę. */
  rysujObrys(wzgorzaPary(), 'wzgorze', '#BBD08C', '#6d8447',
    (k) => '▲ ' + (k.wysokosc ?? .5).toFixed(2));

  /* OCZKO WODY i FASOLA — dwa filary swiata W2, wiec musza byc na planie.
     Oba to pojedyncze obiekty w mapie (jak latarnia czy most), nie pozycje
     w tablicy. Rysujemy je PRZED drzewami, zeby kregi lezaly pod bryłami,
     a nie na nich.

     Przerywane kolo przy fasoli to `zasieg` — dokladnie ten promien, w ktorym
     scena przyjmuje krople i zaczyna wspinaczke (i ktory dziecko widzi jako
     krag aktywnosci). Kolo przy oczku to jego `promien`; lisek nabiera wody
     juz na 85 % tej odleglosci. */
  if (mapa.oczko) {
    const p = mapa.oczko.pos;
    uchwyt('oczko', 0, el('circle', { cx:p[0], cy:p[1], r: mapa.oczko.promien ?? 1.4,
      fill:'#8FCBE8', 'fill-opacity':.7, stroke:'#2E7AB8', 'stroke-width':.1 }));
    el('text', { x:p[0], y:p[1] + .16, 'font-size':.42, fill:'#1c5a86', 'text-anchor':'middle',
      'pointer-events':'none' }).textContent = 'woda';
  }
  /* PLAC BUDOWY. Pojedynczy obiekt, jak fasola czy oczko — bo całe zadanie
     prowadzi do JEDNEJ rzeczy, której światu brakuje. Rysujemy dwa kręgi:
     ciągły to obrys klepiska (tyle miejsca zajmie domek na drzewie), przerywany to
     `zasieg` — z tej odległości lisek oddaje materiał.

     Kreskowane linie do celów rąbania NIE SĄ OZDOBĄ. Od ich długości zależy,
     czy doniesienie drewna jest kursem, czy krokiem w bok — a tego na oko
     z planu nie widać, bo skala jest umowna. Liczba przy linii to odległość
     po kuli, ta sama, którą liczy scena. */
  if (mapa.schronienie && Array.isArray(mapa.schronienie.pos)) {
    const p = mapa.schronienie.pos, sk = mapa.schronienie.skala ?? 1;
    const cele = [];
    (mapa.sucheDrzewka || []).forEach((d) => cele.push({ pos:[d.pos[0] + .72, d.pos[1] + .3], co:'drewno' }));
    (mapa.glazy || []).forEach((g) => { if (g.doRozbicia) cele.push({ pos:g.pos, co:'kamienie' }); });
    cele.forEach((c, ci) => {
      el('line', { x1:p[0], y1:p[1], x2:c.pos[0], y2:c.pos[1],
        stroke:'#B4772A', 'stroke-width':.05, 'stroke-dasharray':'.18 .2', opacity:.75 });
      const d = Math.hypot(c.pos[0] - p[0], c.pos[1] - p[1]);
      /* Podpisy ROZSTAWIAMY WZDŁUŻ LINII na przemian (0,52 / 0,76), bo przy
         dwóch celach w podobnym kierunku środki obu odcinków wypadają blisko
         siebie i napisy kładły się na sobie. Jasna obwódka (`paint-order`)
         trzyma je czytelnymi nad etykietami gwiazdek i puzli, których na
         polanie jest gęsto. */
      const t = ci % 2 ? .76 : .52;
      el('text', { x:p[0] + (c.pos[0] - p[0]) * t, y:p[1] + (c.pos[1] - p[1]) * t - .14,
        'font-size':.38, 'text-anchor':'middle', fill:'#8a5a1c', 'pointer-events':'none',
        stroke:'#FBF1D6', 'stroke-width':.14, 'paint-order':'stroke', 'font-weight':'700' })
        .textContent = c.co + ' ' + (Math.round(d * 10) / 10);
    });
    el('circle', { cx:p[0], cy:p[1], r:mapa.schronienie.zasieg ?? 1.35, fill:'none',
      stroke:'#E08A2E', 'stroke-width':.08, 'stroke-dasharray':'.3 .24' });
    kreskaObrotu(mapa.schronienie, 1.2 * sk, '#8a5a1c');
    uchwyt('schronienie', 0, el('circle', { cx:p[0], cy:p[1], r:1.02 * sk,
      fill:'#C9B48A', 'fill-opacity':.6, stroke:'#8a5a1c', 'stroke-width':.11 }));
    el('text', { x:p[0], y:p[1] + .16, 'font-size':.4, fill:'#6b4a1c', 'text-anchor':'middle',
      'pointer-events':'none' }).textContent = 'plac';
  }
  if (mapa.fasola) {
    const p = mapa.fasola.pos;
    el('circle', { cx:p[0], cy:p[1], r: mapa.fasola.zasieg ?? 1.9, fill:'none',
      stroke:'#6FB84A', 'stroke-width':.09, 'stroke-dasharray':'.32 .26' });
    kreskaObrotu(mapa.fasola, 1.1, '#3f7a2a');
    uchwyt('fasola', 0, el('circle', { cx:p[0], cy:p[1], r:.46,
      fill:'#6FB84A', stroke:'#3f7a2a', 'stroke-width':.11 }));
  }

  (mapa.drzewa || []).forEach((d, i) => {
    uchwyt('drzewo', i, el('circle', {
      cx:d.pos[0], cy:d.pos[1], r:.75 * (d.skala ?? 1),
      fill: d.typ === 'lisciaste' ? '#7CC079' : '#4E8F5E', 'fill-opacity':.9,
      stroke:'#33613f', 'stroke-width':.06 }));
    kreskaObrotu(d, .75 * (d.skala ?? 1), '#33613f');
  });
  (mapa.glazy || []).forEach((g, i) => {
    const r = .55 * (g.skala ?? 1);
    /* GŁAZ DO ROZBICIA wygląda inaczej, bo ZNACZY co innego: to nie dekoracja,
       tylko cel zadania. Przerywany krąg to `zasieg` — odległość, z której
       scena przyjmuje uderzenie. Bez niego nie da się na planie ocenić, czy
       dziecko w ogóle dojdzie do głazu między drzewami. */
    if (g.doRozbicia) {
      el('circle', { cx:g.pos[0], cy:g.pos[1], r:g.zasieg ?? 1.9, fill:'none',
        stroke:'#E08A2E', 'stroke-width':.08, 'stroke-dasharray':'.3 .24' });
    }
    uchwyt('glaz', i, el('circle', {
      cx:g.pos[0], cy:g.pos[1], r, fill: g.doRozbicia ? '#CFC3A8' : '#B9B3A6',
      stroke: g.doRozbicia ? '#B4772A' : '#7d786d', 'stroke-width': g.doRozbicia ? .1 : .06 }));
    kreskaObrotu(g, r, '#5f5b53');
    if (g.doRozbicia)
      el('text', { x:g.pos[0], y:g.pos[1] - r - .22, 'font-size':.38, 'text-anchor':'middle',
        fill:'#8a5a1c', 'pointer-events':'none' }).textContent = 'do rozbicia';
  });

  /* SUCHE DRZEWKA — jedyne, które wolno ściąć. Rysujemy je JAŚNIEJ niż żywe
     drzewa i pustym środkiem: to ten sam sygnał, co w scenie (suchy pień jest
     bledszy od żywego), więc plan i świat mówią to samo. */
  (mapa.sucheDrzewka || []).forEach((d, i) => {
    const r = .42 * ((d.wysokosc ?? 2.4) / 2.4);
    el('circle', { cx:d.pos[0], cy:d.pos[1], r:d.zasieg ?? 1.6, fill:'none',
      stroke:'#E08A2E', 'stroke-width':.08, 'stroke-dasharray':'.3 .24' });
    uchwyt('suche', i, el('circle', {
      cx:d.pos[0], cy:d.pos[1], r, fill:'#D8C7A4', stroke:'#8a7557', 'stroke-width':.11 }));
    kreskaObrotu(d, r, '#8a7557');
    el('text', { x:d.pos[0], y:d.pos[1] - r - .22, 'font-size':.38, 'text-anchor':'middle',
      fill:'#7a6244', 'pointer-events':'none' }).textContent = 'suche';
  });

  // Kwiat jest mały, więc uchwyt musi być większy niż sam obiekt — inaczej
  // nie dałoby się w niego trafić palcem przy oddalonym widoku.
  if (kwiatyGrupa.pokaz) (mapa.kwiaty || []).forEach((k, i) => {
    const odmiana = KWIATY_ODMIANY[k.wariant ?? 0] || KWIATY_ODMIANY[0];
    const otw = kwiatyGrupa.otwarta;
    const kolko = el('circle', {
      cx:k.pos[0], cy:k.pos[1], r:(otw ? .3 : .15) * (k.skala ?? 1), fill:odmiana.kolor,
      stroke:'#5c8c3a', 'stroke-width': otw ? .07 : .03, opacity: otw ? 1 : .5 });
    // Zamknieta grupa to dywan do ogladania, nie do klikania — bez tego kwiaty
    // dalej lapalyby kazde klikniecie w teren pod nimi.
    if (otw) uchwyt('kwiat', i, kolko);
    else kolko.style.pointerEvents = 'none';
  });

  (mapa.budynki || []).forEach((b, i) => {
    const r = b.promien ?? 1.4, p = b.pos, kat = b.obrot ?? 0;
    uchwyt('budynek', i, el('rect', { x:p[0]-r, y:p[1]-r, width:r*2, height:r*2, rx:.25,
      fill:'#E2B98C', stroke:'#9a6b3c', 'stroke-width':.08,
      transform:`rotate(${-kat * 180 / Math.PI} ${p[0]} ${p[1]})` }));
    el('line', { x1:p[0], y1:p[1], x2:p[0] + Math.sin(kat) * r, y2:p[1] + Math.cos(kat) * r,
      stroke:'#8a5a2b', 'stroke-width':.09 });
    el('text', { x:p[0], y:p[1] - r - .25, 'font-size':.45, 'text-anchor':'middle', fill:'#6b4b2a' }).textContent = b.file;
  });

  (mapa.znaki || []).forEach((z, i) => {
    const p = z.pos || [0,0], r = .45 * (z.scale ?? 1), kat = z.obrotY ?? 0;
    uchwyt('znak', i, el('polygon', {
      points:`${p[0]},${p[1]-r} ${p[0]+r},${p[1]} ${p[0]},${p[1]+r} ${p[0]-r},${p[1]}`,
      fill:'#FFD269', stroke:'#B47322', 'stroke-width':.07,
      transform:`rotate(${-kat * 180 / Math.PI} ${p[0]} ${p[1]})` }));
    // Wskaźnik kierunku — bez niego romb wygląda tak samo pod każdym kątem
    // i obracanie sprawia wrażenie, że nic się nie dzieje.
    if (obrotDziala(z))
      el('line', { x1:p[0], y1:p[1], x2:p[0] + Math.sin(kat) * (r + .35), y2:p[1] + Math.cos(kat) * (r + .35),
        stroke:'#B47322', 'stroke-width':.1, 'stroke-linecap':'round' });
    el('text', { x:p[0], y:p[1] + r + .55, 'font-size':.42, 'text-anchor':'middle', fill:'#6b4b2a' }).textContent = z.id;
  });

  rysujUchwyty();
  rysujListe();
  rysujWlasciwosci();
}

/** Pola, po ktorych „skaluje sie" dany typ — kazdy ma inna jednostke. */
const POLE_SKALI = { znak:'scale', drzewo:'skala', glaz:'skala', budynek:'wysokosc', oczko:'promien',
                     suche:'wysokosc', schronienie:'skala' };
const POLE_OBROTU = { znak:'obrotY', budynek:'obrot', drzewo:'obrot', glaz:'obrot', start:'obrot', fasola:'obrot',
                      suche:'obrot', schronienie:'obrot' };

/**
 * Czy silnik w ogóle POSŁUCHA zadanego kąta znaku.
 *
 * Scena traktuje znaki trojako: `faceCamera` obraca je za kamerą, brak obu flag
 * znaczy „kręć się w kółko", i dopiero `bezObrotu` przykręca model do kąta
 * z danych. Czarodziej ma `bezObrotu`, więc daje się ustawić — gwiazdki i medal
 * nie, i dlatego kręcenie nimi w edytorze wyglądało na zepsute. Zamiast to
 * ukrywać, pokazujemy stan wprost i pozwalamy przełączyć zachowanie.
 */
function obrotDziala(z) {
  return !!z.bezObrotu && !z.faceCamera;
}

/**
 * Dwa uchwyty przy zaznaczonym obiekcie: kolko NAD nim obraca, kwadrat OBOK
 * skaluje. To ta sama robota co suwaki po prawej, tylko pod ręką — przy
 * ustawianiu chaty względem ścieżki wygodniej ciągnąć niż celować w liczbę.
 */
function rysujUchwyty() {
  if (!wybor) return;
  const o = obiektWyboru();
  if (!o || !o.pos || (!POLE_SKALI[wybor.typ] && !POLE_OBROTU[wybor.typ])) return;
  const [x, z] = o.pos;
  const r = promienRysunku(wybor.typ, o) + .7;

  el('line', { x1:x, y1:z, x2:x, y2:z - r, stroke:'#7A4DC2', 'stroke-width':.05, 'stroke-dasharray':'.2 .2' });
  const obrot = el('circle', { cx:x, cy:z - r, r:.26, fill:'#EFE3FA', stroke:'#7A4DC2', 'stroke-width':.08 });
  obrot.dataset.typ = 'uchwyt-obrot';
  obrot.dataset.idx = '0';
  obrot.style.cursor = 'alias';

  const skala = el('rect', { x:x + r - .24, y:z - .24, width:.48, height:.48, rx:.1,
                             fill:'#FFF3D3', stroke:'#B47322', 'stroke-width':.08 });
  skala.dataset.typ = 'uchwyt-skala';
  skala.dataset.idx = '0';
  skala.style.cursor = 'ew-resize';
}

function promienRysunku(typ, o) {
  if (typ === 'znak') return .45 * (o.scale ?? 1);
  if (typ === 'drzewo') return .75 * (o.skala ?? 1);
  if (typ === 'glaz') return .55 * (o.skala ?? 1);
  if (typ === 'suche') return .42 * ((o.wysokosc ?? 2.4) / 2.4);
  if (typ === 'schronienie') return 1.02 * (o.skala ?? 1);
  if (typ === 'budynek') return o.promien ?? 1.4;
  if (typ === 'fasola') return o.zasieg ?? 1.9;
  if (typ === 'oczko') return o.promien ?? 1.4;
  return .5;
}

/* ── Lista obiektów ──────────────────────────────────────────────────────── */
const KOLORY = { znak:'#FFD269', budynek:'#E2B98C', drzewo:'#4E8F5E', glaz:'#B9B3A6',
                 latarnia:'#FFE08A', brama:'#B58A5B', most:'#C9A06A', kwiat:'#F08FB4',
                 galaz:'#CDA96F', fasola:'#6FB84A', oczko:'#8FCBE8',
                 suche:'#D8C7A4', schronienie:'#C9B48A',
                 oczko:'#5FC4DE', wzgorze:'#A8C078' };

// Te same pięć odmian, co w scenie (`scena3d.js`, tablica PALETA przy kwiatach).
// Kolejność jest znacząca: `wariant` to indeks w tej tablicy.
const KWIATY_ODMIANY = [
  { nazwa:'stokrotka', kolor:'#FDF6E6' },
  { nazwa:'jaskier',   kolor:'#F7C948' },
  { nazwa:'koniczyna', kolor:'#F08FB4' },
  { nazwa:'bławatek',  kolor:'#7AA6E8' },
  { nazwa:'dzwonek',   kolor:'#B98AE0' },
];

function rysujListe() {
  const lista = $('#lista');
  lista.innerHTML = '';
  const dodaj = (typ, idx, tekst) => {
    const b = document.createElement('button');
    const kropka = document.createElement('span');
    kropka.className = 'znacznik';
    kropka.style.background = KOLORY[typ] || '#ccc';
    b.append(kropka, document.createTextNode(tekst));
    if (wybor && wybor.typ === typ && String(wybor.idx) === String(idx)) b.className = 'akt';
    b.onclick = () => { wybor = { typ, idx }; rysuj(); };
    lista.appendChild(b);
  };
  (mapa.znaki || []).forEach((z, i) => dodaj('znak', i, z.id + ' · ' + z.file));
  (mapa.budynki || []).forEach((b, i) => dodaj('budynek', i, b.file));
  (mapa.drzewa || []).forEach((d, i) => dodaj('drzewo', i, 'drzewo ' + (i + 1) + ' · ' + d.typ));
  (mapa.glazy || []).forEach((g, i) =>
    dodaj('glaz', i, 'głaz ' + (i + 1) + (g.doRozbicia ? ' · do rozbicia' : '')));
  (mapa.sucheDrzewka || []).forEach((d, i) =>
    dodaj('suche', i, 'suche drzewko ' + (i + 1) + (d.id ? ' · ' + d.id : '')));
  wierszKwiatow(lista, dodaj);
  (mapa.galezie || []).forEach((g, i) =>
    dodaj('galaz', i + ':1', 'gałąź ' + (i + 1) + ' · od węzła ' + (g.od ?? 0)));
  // Dopisek „(ukryta)" jest jedynym miejscem, w którym widać ten stan bez
  // klikania w uchwyt na planie — a to pierwsze miejsce, w którym ktoś będzie
  // szukał latarni, gdy zniknie ze sceny.
  if (mapa.latarnia) dodaj('latarnia', 0, mapa.latarnia.ukryta ? 'latarnia (ukryta)' : 'latarnia');
  if (mapa.start) dodaj('start', 0, 'start liska');
  if (mapa.fasola) dodaj('fasola', 0, 'magiczna fasola');
  if (mapa.oczko) dodaj('oczko', 0, 'oczko wody');
  if (mapa.schronienie) dodaj('schronienie', 0, 'plac budowy domku na drzewie');
  oczkaPary().forEach(({ k, gi }) =>
    dodaj('oczko', gi + ':0', 'staw ' + (gi + 1) + ' · ' + (k.punkty?.length ?? 0) + ' pkt'));
  wzgorzaPary().forEach(({ k, gi }) =>
    dodaj('wzgorze', gi + ':0', 'wzgórze ' + (k.wysokosc ?? .5).toFixed(2) + ' · ' + (k.punkty?.length ?? 0) + ' pkt'));
  if (mapa.brama) dodaj('brama', 0, mapa.brama.ukryta ? 'brama (ukryta)' : 'brama');
  if (mapa.most) dodaj('most', 0, mapa.most.ukryty ? 'most (ukryty)' : 'most');
}

/**
 * Jeden wiersz zamiast stu: „kwiaty · 96" otwiera grupe, przycisk obok chowa ja
 * z planu. Dopiero otwarta grupa wypisuje pojedyncze kwiaty i pozwala je
 * zaznaczac — zamknieta trzyma je z dala od klikniec w reszte swiata.
 */
function wierszKwiatow(lista, dodaj) {
  const ile = (mapa.kwiaty || []).length;
  if (!ile) return;
  const wiersz = document.createElement('div');
  wiersz.className = 'grupa';

  const nazwa = document.createElement('button');
  nazwa.className = 'nazwa' + (kwiatyGrupa.otwarta ? ' akt' : '');
  const kropka = document.createElement('span');
  kropka.className = 'znacznik';
  kropka.style.background = KOLORY.kwiat;
  nazwa.append(kropka, document.createTextNode((kwiatyGrupa.otwarta ? '▾ ' : '▸ ') + 'kwiaty · ' + ile));
  nazwa.title = kwiatyGrupa.otwarta
    ? 'Zwiń grupę — kwiaty przestaną łapać kliknięcia'
    : 'Otwórz grupę, żeby edytować pojedyncze kwiaty';
  nazwa.onclick = () => {
    kwiatyGrupa.otwarta = !kwiatyGrupa.otwarta;
    if (kwiatyGrupa.otwarta) kwiatyGrupa.pokaz = true;
    else if (wybor && wybor.typ === 'kwiat') wybor = null;
    zapiszUiKwiatow();
    rysuj();
  };

  const oko = document.createElement('button');
  oko.className = 'oko';
  oko.textContent = kwiatyGrupa.pokaz ? 'widać' : 'ukryte';
  oko.title = 'Kwiaty na planie edytora — w scenie są zawsze';
  oko.onclick = () => {
    kwiatyGrupa.pokaz = !kwiatyGrupa.pokaz;
    if (!kwiatyGrupa.pokaz) {
      kwiatyGrupa.otwarta = false;
      if (wybor && wybor.typ === 'kwiat') wybor = null;
    }
    zapiszUiKwiatow();
    rysuj();
  };

  wiersz.append(nazwa, oko);
  lista.appendChild(wiersz);
  if (!kwiatyGrupa.otwarta) return;

  const pod = document.createElement('div');
  pod.className = 'podgrupa';
  lista.appendChild(pod);
  (mapa.kwiaty || []).forEach((k, i) => {
    dodaj('kwiat', i, 'kwiat ' + (i + 1) + ' · ' + (KWIATY_ODMIANY[k.wariant ?? 0] || KWIATY_ODMIANY[0]).nazwa);
    pod.appendChild(lista.lastChild);   // `dodaj` dokleja do listy — przenosimy pod nagłówek grupy
  });
}

/* ── Panel właściwości ───────────────────────────────────────────────────── */
/** Cały kształt (staw albo wzgórze) spod zaznaczenia — panel opisuje kształt,
 *  a `obiektWyboru` zwraca pojedynczy wierzchołek do przeciągania. */
function ksztaltWyboru() {
  if (!wybor) return null;
  const gi = Number(String(wybor.idx).split(':')[0]);
  if (wybor.typ === 'oczko') return mapa.oczka?.[gi] || null;
  if (wybor.typ === 'wzgorze') return mapa.formyTerenu?.[gi] || null;
  return null;
}

function obiektWyboru() {
  if (!wybor) return null;
  const { typ, idx } = wybor;
  if (typ === 'znak') return mapa.znaki?.[idx];
  if (typ === 'budynek') return mapa.budynki?.[idx];
  if (typ === 'drzewo') return mapa.drzewa?.[idx];
  if (typ === 'glaz') return mapa.glazy?.[idx];
  if (typ === 'suche') return mapa.sucheDrzewka?.[idx];
  if (typ === 'oczko' || typ === 'wzgorze') {
    const [gi, i] = String(idx).split(':').map(Number);
    const k = typ === 'oczko' ? mapa.oczka?.[gi] : mapa.formyTerenu?.[gi];
    return k?.punkty?.[i] ? { pos: k.punkty[i] } : null;
  }
  if (typ === 'schronienie') return mapa.schronienie;
  if (typ === 'kwiat') return mapa.kwiaty?.[idx];
  if (typ === 'start') return mapa.start;
  if (typ === 'latarnia') return mapa.latarnia;
  if (typ === 'fasola') return mapa.fasola;
  if (typ === 'oczko') return mapa.oczko;
  if (typ === 'brama') return mapa.brama;
  if (typ === 'most') return mapa.most;
  if (typ === 'sciezka') return { pos: wezly()[idx] };
  if (typ === 'galaz') {
    const [gi, i] = String(idx).split(':').map(Number);
    return { pos: mapa.galezie?.[gi]?.punkty?.[i] };
  }
  if (typ === 'rzeka') { const [i, rola] = String(idx).split(':'); return { pos: mapa.rzeka.krzywe[i][rola] }; }
  return null;
}

function pole(rodzic, etykieta) {
  const w = document.createElement('div');
  w.className = 'pole';
  const l = document.createElement('label');
  l.textContent = etykieta;
  w.appendChild(l);
  rodzic.appendChild(w);
  return w;
}
function poleTekst(rodzic, etykieta, wartosc, przy, typ = 'text') {
  const w = pole(rodzic, etykieta);
  const i = document.createElement('input');
  i.type = typ;
  if (typ === 'number') i.step = '0.05';
  i.value = wartosc ?? '';
  i.oninput = () => przy(typ === 'number' ? Number(i.value) : i.value);
  w.appendChild(i);
}
/** Po ręcznej zmianie współrzędnych węzeł trzeba wypalić od nowa — inaczej
 *  wstęga na planie zostaje tam, gdzie była, a plik zapisze się rozjechany. */
function poRuchuWezla() {
  if (wybor?.typ === 'sciezka') przeliczSciezke();
  if (wybor?.typ === 'galaz') przeliczGalezie();
}

function polePara(rodzic, etykieta, para) {
  const w = pole(rodzic, etykieta);
  const box = document.createElement('div');
  box.className = 'para2';
  [0, 1].forEach((k) => {
    const i = document.createElement('input');
    i.type = 'number'; i.step = '0.1'; i.value = para[k];
    i.oninput = () => { para[k] = Number(i.value); poRuchuWezla(); zapisz(); rysuj(); };
    box.appendChild(i);
  });
  w.appendChild(box);
}
/** Suwak + pole liczbowe na jednej linii — do skali, obrotu i wysokosci.
 *  Suwak jest do „pokreccenia na oko", pole obok do wpisania konkretu.        */
function poleSuwak(rodzic, etykieta, wartosc, { min, max, krok = .05 }, przy) {
  const w = pole(rodzic, etykieta);
  const box = document.createElement('div');
  box.className = 'suwak';
  const s = document.createElement('input');
  const n = document.createElement('input');
  s.type = 'range'; s.min = min; s.max = max; s.step = krok; s.value = wartosc ?? min;
  n.type = 'number'; n.step = krok; n.value = wartosc ?? min;
  s.oninput = () => { n.value = s.value; przy(Number(s.value)); };
  n.oninput = () => { s.value = n.value; przy(Number(n.value)); };
  box.append(s, n);
  w.appendChild(box);
}

function poleWybor(rodzic, etykieta, wartosc, opcje, przy) {
  const w = pole(rodzic, etykieta);
  const s = document.createElement('select');
  const lista = opcje.includes(wartosc) ? opcje : [wartosc, ...opcje];
  for (const o of lista) {
    const opt = document.createElement('option');
    opt.value = o; opt.textContent = o;
    if (o === wartosc) opt.selected = true;
    s.appendChild(opt);
  }
  s.onchange = () => przy(s.value);
  w.appendChild(s);
}
function poleKolor(rodzic, etykieta, liczba, przy) {
  const w = pole(rodzic, etykieta);
  const i = document.createElement('input');
  i.type = 'color';
  i.value = '#' + Number(liczba || 0).toString(16).padStart(6, '0');
  i.oninput = () => przy(parseInt(i.value.slice(1), 16));
  w.appendChild(i);
}
function poleTak(rodzic, etykieta, wartosc, przy) {
  const w = pole(rodzic, etykieta);
  const i = document.createElement('input');
  i.type = 'checkbox';
  i.checked = !!wartosc;
  i.onchange = () => przy(i.checked);
  w.appendChild(i);
}
function podpowiedz(rodzic, tekst) {
  const p = document.createElement('div');
  p.className = 'podpowiedz';
  p.textContent = tekst;
  rodzic.appendChild(p);
}

/** Suwaki łuku ścieżki — te same w panelu węzła i w panelu świata. */
function ustawieniaLuku(box) {
  zapewnijWezly();
  const w = mapa.sciezkaWezly;
  poleSuwak(box, 'łuk ścieżki', w.gladkosc ?? 0, { min:0, max:1, krok:.05 }, (v) => {
    w.gladkosc = v;
    if (v > 0 && (w.probki || 1) < 6) w.probki = 8;   // sam splajn bez próbek nic nie da
    przeliczSciezke(); zapisz(); rysuj();
  });
  poleSuwak(box, 'gęstość', w.probki ?? 1, { min:1, max:16, krok:1 }, (v) => {
    w.probki = Math.round(v);
    przeliczSciezke(); zapisz(); rysuj();
  });
}

function rysujWlasciwosci() {
  const box = $('#wlasciwosci');
  box.innerHTML = '';
  const o = obiektWyboru();
  const zmiana = () => { zapisz(); rysuj(); };

  if (!o) {
    box.innerHTML = '<p class="pusty">Nic nie zaznaczone — poniżej ustawienia całego świata.</p><h2>Świat</h2>';
    poleSuwak(box, 'promień kuli (R)', mapa.swiat?.promienKuli ?? 8, { min:4, max:30, krok:.25 }, (v) => { mapa.swiat.promienKuli = v; zmiana(); });
    /* JEDYNA LICZBA, KTÓRA NAPRAWDĘ OKREŚLA WIELKOŚĆ ŚWIATA to promień kuli.
       Reszta to kreski na planie — i właśnie dlatego trzeba napisać wprost,
       ile planety obejmują, bo inaczej „promień 14" czyta się jak krawędź
       świata, a to ledwie połowa kuli. */
    const Rk = mapa.swiat?.promienKuli ?? 8.5;
    const stopnie = (r) => Math.round((r / Rk) * 180 / Math.PI);
    const procent = (r) => Math.round((1 - Math.cos(r / Rk)) / 2 * 100);
    const pr = mapa.swiat?.promien ?? 12.5;
    podpowiedz(box, `Cała planeta to koło o promieniu ${(Math.PI * Rk).toFixed(1)} na tym planie (antypod = 180°). `
      + `Obiekty i bohater NIE mają tu granicy — stawiaj i chodź po całej kuli, także po nocnej stronie.`);
    poleTekst(box, 'promień mapy', mapa.swiat?.promien, (v) => { mapa.swiat.promien = v; zmiana(); }, 'number');
    podpowiedz(box, `„Promień mapy" ${pr} to ${stopnie(pr)}° od środka, czyli ${procent(pr)} % powierzchni kuli. `
      + `Sam z siebie NICZEGO nie ogranicza — działa dopiero jako płot, gdy włączysz „tylko mapa" poniżej.`);
    poleTak(box, 'tylko mapa (płot)', mapa.swiat?.tylkoMapa, (v) => {
      if (v) mapa.swiat.tylkoMapa = true; else delete mapa.swiat.tylkoMapa;
      zmiana();
    });
    podpowiedz(box, 'Włączone: bohater nie wyjdzie poza „promień mapy". Wyłączone (domyślnie): obchodzi planetę dookoła.');
    poleTekst(box, 'zasięg ścieżki i rzeki', mapa.swiat?.promienTresci,
      (v) => { if (v) mapa.swiat.promienTresci = v; else delete mapa.swiat.promienTresci; zmiana(); }, 'number');
    podpowiedz(box, `Puste = ${(0.72 * Math.PI * Rk).toFixed(1)} (${stopnie(0.72 * Math.PI * Rk)}°). `
      + 'Dalej rzut rozmazuje długie linie w wachlarz, więc ścieżka i rzeka są przycinane. Dotyczy TYLKO ich.');
    poleTekst(box, 'teren (stara tekstura)', mapa.swiat?.teren, (v) => { mapa.swiat.teren = v; zmiana(); }, 'number');
    poleSuwak(box, 'szer. rzeki', mapa.rzeka?.szerokosc, { min:.4, max:4, krok:.1 }, (v) => { mapa.rzeka.szerokosc = v; zmiana(); });
    ustawieniaLuku(box);
    /* Plac budowy jest pojedynczy, więc nie ma dla niego narzędzia „+”. Gdy
       mapa go nie ma, stawiamy go w środku świata i od razu zaznaczamy —
       resztę robi się przeciąganiem. */
    if (!mapa.schronienie) {
      const postaw = document.createElement('button');
      postaw.textContent = '+ Plac budowy domku na drzewie';
      postaw.onclick = () => {
        mapa.schronienie = { opis:'', pos:[0, 0], skala:1, obrot:0, zasieg:1.35 };
        wybor = { typ:'schronienie', idx:0 };
        zapisz(); rysuj();
      };
      box.appendChild(postaw);
      podpowiedz(box, 'Ta mapa nie ma placu budowy — bez niego dziecko nie ma gdzie zanieść drewna i kamieni, a budowa domku na drzewie nie ruszy.');
    }

    /* USTAWIENIA ŚWIATA W2. Edytor powstal dla pierwszej mapy i o tych polach
       nie wiedzial — a to one decyduja o tym, czy swiat ma dzien i noc, chmury,
       kwiaty za liskiem i jak blisko stoi kamera. Brak ich w panelu znaczyl, ze
       jedyna droga do nich bylo recznie grzebanie w JSON-ie. */
    const nagl = document.createElement('h2');
    nagl.textContent = 'Niebo, teren, kamera';
    box.appendChild(nagl);
    const sw = (mapa.swiat ||= {});
    poleTak(box, 'cykl dnia i nocy', sw.cyklDnia, (v) => { sw.cyklDnia = v; zmiana(); });
    polePara(box, 'słońce nad X / Z', (sw.slonceNad ||= [0, 0]));
    poleTak(box, 'cienie', sw.cienie, (v) => { sw.cienie = v; zmiana(); });
    poleSuwak(box, 'kanciastość terenu', sw.terenKanciasty ?? 0, { min:0, max:16, krok:1 }, (v) => { sw.terenKanciasty = Math.round(v); zmiana(); });
    poleSuwak(box, 'chmury', sw.chmury ?? 0, { min:0, max:12, krok:1 }, (v) => { sw.chmury = Math.round(v); zmiana(); });
    poleTak(box, 'kwiaty za liskiem (zasiew)', sw.zasiew, (v) => { sw.zasiew = v; zmiana(); });
    poleSuwak(box, 'zoom kamery', sw.zoom ?? 1, { min:.6, max:2, krok:.01 }, (v) => { sw.zoom = v; zmiana(); });
    poleSuwak(box, 'podniesienie kamery', sw.kameraPodniesienie ?? 0, { min:-8, max:8, krok:.25 }, (v) => { sw.kameraPodniesienie = v; zmiana(); });
    poleSuwak(box, 'ekspozycja', sw.ekspozycja ?? 1, { min:.6, max:2, krok:.01 }, (v) => { sw.ekspozycja = v; zmiana(); });
    poleTak(box, 'dolny dok HUD-u', sw.dolnyDok, (v) => { sw.dolnyDok = v; zmiana(); });
    podpowiedz(box, 'Słońce nad punktem mapy wyznacza porę dnia: kąt od środka mapy to zegar — 0° to południe, 90° zmierzch, 180° noc. Przy wyłączonym cyklu dnia świat stoi w jednej porze.');
    podpowiedz(box, 'Kanciastość dzieli teren na fasety (0 = gładka kula). Podniesienie kamery jest w metrach i bywa ujemne — kamera schodzi wtedy niżej, bliżej trawy.');

    podpowiedz(box, 'Promień to granica chodzenia bohatera, teren to bok trawy pod sceną. Rzeka wyznacza, gdzie chodzić NIE można — z wyjątkiem mostu.');
    podpowiedz(box, 'PLANETA: świat jest kulą, a ten plan to jej rozwinięcie ze środka (odległości od środka są prawdziwe, przy skraju rzeczy zbliżają się do siebie). „Promień kuli” mówi, jak mała jest planeta: 8 = cała mapa opasuje ją prawie dookoła, 20 = łagodna krzywizna.');
    return;
  }

  const naglowek = document.createElement('h2');
  naglowek.textContent = wybor.typ;
  box.appendChild(naglowek);
  if (o.pos) polePara(box, 'pozycja X / Z', o.pos);

  if (wybor.typ === 'znak') {
    poleTekst(box, 'id', o.id, (v) => { o.id = v; zmiana(); });
    poleWybor(box, 'model', o.file, MODELE, (v) => { o.file = v; zmiana(); });
    poleTekst(box, 'etykieta', o.label, (v) => { o.label = v; zmiana(); });
    poleTekst(box, 'toast', o.toast, (v) => { o.toast = v; zmiana(); });
    poleSuwak(box, 'skala', o.scale, { min:.2, max:6 }, (v) => { o.scale = v; zmiana(); });
    poleSuwak(box, 'wysokość', o.height, { min:0, max:4 }, (v) => { o.height = v; zmiana(); });
    poleWybor(box, 'obrót', obrotDziala(o) ? 'stały kąt' : (o.faceCamera ? 'patrzy w kamerę' : 'kręci się w kółko'),
      ['stały kąt', 'kręci się w kółko', 'patrzy w kamerę'], (v) => {
        if (v === 'stały kąt') { o.bezObrotu = true; delete o.faceCamera; }
        else if (v === 'patrzy w kamerę') { o.faceCamera = true; delete o.bezObrotu; }
        else { delete o.bezObrotu; delete o.faceCamera; }
        zmiana();
      });
    poleSuwak(box, 'kąt [rad]', o.obrotY, { min:-3.15, max:3.15, krok:.01 }, (v) => { o.obrotY = v; zmiana(); });
    if (!obrotDziala(o))
      podpowiedz(box, o.faceCamera
        ? 'Ten znak patrzy w kamerę — silnik nadpisuje kąt co klatkę, więc suwak nic nie da. Przełącz na „stały kąt”, żeby ustawić go ręcznie.'
        : 'Ten znak kręci się w kółko (tak chodzą gwiazdki i medal), więc zadany kąt jest ignorowany. Przełącz na „stały kąt”, żeby go zatrzymać w wybranej pozycji.');
    poleKolor(box, 'poświata', o.glow, (v) => { o.glow = v; zmiana(); });
    poleKolor(box, 'pierścień', o.ringColor, (v) => { o.ringColor = v; zmiana(); });
    poleTak(box, 'znika po dotknięciu', o.absorb, (v) => { o.absorb = v; zmiana(); });
    poleTekst(box, 'wraca po [s]', o.respawn, (v) => { o.respawn = v; zmiana(); }, 'number');
    podpowiedz(box, 'Id trafia do aplikacji w zdarzeniu dotknięcia — po nim hub decyduje, którą minigrę odpalić (mapa ZNAK_GRY w Swiat.jsx).');
  }
  if (wybor.typ === 'budynek') {
    poleWybor(box, 'model', o.file, MODELE, (v) => { o.file = v; zmiana(); });
    poleSuwak(box, 'wysokość', o.wysokosc, { min:.5, max:12, krok:.1 }, (v) => { o.wysokosc = v; zmiana(); });
    poleSuwak(box, 'obrót [rad]', o.obrot, { min:-3.15, max:3.15, krok:.01 }, (v) => { o.obrot = v; zmiana(); });
    poleSuwak(box, 'kolizja r', o.promien, { min:.2, max:6, krok:.1 }, (v) => { o.promien = v; zmiana(); });
    poleSuwak(box, 'jasność', o.jasnosc, { min:.4, max:2.5 }, (v) => { o.jasnosc = v; zmiana(); });
    podpowiedz(box, 'Wysokość skaluje model tak, żeby miał tyle metrów — nie mnoży go. Obrót w radianach (Q i E przestawiają co 15°).');
  }
  if (wybor.typ === 'drzewo') {
    poleWybor(box, 'typ', o.typ, ['sosna','lisciaste'], (v) => { o.typ = v; zmiana(); });
    poleSuwak(box, 'skala', o.skala, { min:.3, max:3 }, (v) => { o.skala = v; zmiana(); });
    poleSuwak(box, 'obrót [rad]', o.obrot ?? 0, { min:-3.15, max:3.15, krok:.01 }, (v) => { o.obrot = v; zmiana(); });
    podpowiedz(box, 'Sosny i drzewa liściaste są bryłami obrotowymi tylko z grubsza — obrót zmienia, która gałąź patrzy na ścieżkę.');
  }
  if (wybor.typ === 'glaz') {
    poleSuwak(box, 'skala', o.skala, { min:.3, max:4 }, (v) => { o.skala = v; zmiana(); });
    poleSuwak(box, 'obrót [rad]', o.obrot ?? 0, { min:-3.15, max:3.15, krok:.01 }, (v) => { o.obrot = v; zmiana(); });
    poleTak(box, 'do rozbicia', o.doRozbicia, (v) => {
      if (v) {
        o.doRozbicia = true;
        /* ID JEST OBOWIĄZKOWE, nie ozdobne: zapis zadania pamięta po nim, że
           TEN głaz już rozbito. Bez id ten sam głaz wracałby cały po każdym
           wejściu do świata, a HUD liczyłby go w kółko. Dlatego nadajemy je
           sami, gdy ktoś zapomni. */
        if (!o.id) o.id = 'glaz-' + (Number(wybor.idx) + 1);
      } else {
        delete o.doRozbicia;
      }
      zmiana();
    });
    if (o.doRozbicia) {
      poleTekst(box, 'id (zapis zadania)', o.id, (v) => { o.id = v.trim(); zmiana(); });
      poleSuwak(box, 'zasięg pracy', o.zasieg ?? 1.9, { min:.8, max:3.5, krok:.05 }, (v) => { o.zasieg = v; zmiana(); });
      podpowiedz(box, 'Rozbity głaz zamienia się w kamienie, które dziecko NIESIE na plac budowy. Zasięg musi być większy od kolizji głazu (≈0,6 × skala), inaczej lisek nigdy nie podejdzie dość blisko, żeby zacząć.');
    } else {
      podpowiedz(box, 'Bez ustawionego kąta głaz obraca się wzorem z własnego X — tak jak dotąd. Ruch suwakiem przejmuje nad nim kontrolę.');
    }
  }
  if (wybor.typ === 'oczko' || wybor.typ === 'wzgorze') {
    const k = ksztaltWyboru();
    const i = Number(String(wybor.idx).split(':')[1] || 0);
    const gi = Number(String(wybor.idx).split(':')[0]);
    if (k) {
      podpowiedz(box, `Obrys: ${k.punkty?.length ?? 0} punktów. Klikaj w trybie „+ ${wybor.typ === 'oczko' ? 'Oczko' : 'Wzgórze'}”, żeby dołożyć kolejny; przeciągnij wypełnienie, żeby przesunąć cały kształt; Delete kasuje zaznaczony punkt, a przy trzech ostatnich — cały kształt.`);
      poleSuwak(box, 'łuk brzegu', k.gladkosc ?? OBRYS_GLADKOSC, { min:0, max:1, krok:.05 },
        (v) => { k.gladkosc = v; zmiana(); });
      podpowiedz(box, '0 = łamana z ostrymi kątami, 1 = pełne zaokrąglenie. Krzywa i tak przechodzi przez klikane punkty — łuk zmienia tylko to, co między nimi.');
      if (wybor.typ === 'oczko') {
        poleSuwak(box, 'głębokość', k.glebokosc ?? .11, { min:.04, max:.6, krok:.01 }, (v) => { k.glebokosc = v; zmiana(); });
        poleSuwak(box, 'stok brzegu', k.stok ?? .9, { min:.2, max:2.5, krok:.05 }, (v) => { k.stok = v; zmiana(); });
        podpowiedz(box, 'Stok liczy się W PROMIENIACH kształtu: 0,9 znaczy, że brzeg wraca do poziomu gruntu na dziewięciu dziesiątych promienia za obrysem. Ścianki w tej strefie shader maluje na piaskowo — to jest plaża, nie osobna siatka.');
        podpowiedz(box, 'Staw nie blokuje chodzenia i lisek się w nim nie topi: wchodzi w wodę i nabiera kropli. Liczy się 85 % największego promienia obrysu.');
      } else {
        poleSuwak(box, 'wysokość', k.wysokosc ?? .5, { min:.1, max:3, krok:.05 }, (v) => { k.wysokosc = v; zmiana(); });
        poleSuwak(box, 'płaski wierzchołek', k.plaski ?? 0, { min:0, max:.9, krok:.05 }, (v) => { k.plaski = v; zmiana(); });
        podpowiedz(box, '„Płaski wierzchołek” to udział promienia, na którym góra jest równa — 0 daje kopiec, 0,5 płaskowyż ze zboczem.');
        /* PRÓG OSTRZEŻENIA nie jest wyssany z palca: kamera jest nieruchoma
           i izometryczna, więc teren wyższy niż mniej więcej wzrost liska
           zaczyna go zasłaniać, zamiast dawać głębię. Nie blokujemy tego —
           autor ma prawo zrobić wysoką górę świadomie — ale ma o tym wiedzieć. */
        if ((k.wysokosc ?? .5) > .9)
          podpowiedz(box, 'UWAGA: powyżej 0,9 wzgórze przy tej kamerze potrafi zasłonić bohatera. Sprawdź w podglądzie, przechodząc liskiem za górkę — jeśli znika, obniż albo rozciągnij obrys.');
      }
      const kasujCaly = document.createElement('button');
      kasujCaly.className = 'groza';
      kasujCaly.textContent = wybor.typ === 'oczko' ? 'Usuń cały staw' : 'Usuń całe wzgórze';
      kasujCaly.onclick = () => {
        if (wybor.typ === 'oczko') mapa.oczka.splice(gi, 1);
        else mapa.formyTerenu.splice(gi, 1);
        wybor = null; zapisz(); rysuj();
      };
      box.appendChild(kasujCaly);
    }
  }
  if (wybor.typ === 'suche') {
    poleTekst(box, 'id (zapis zadania)', o.id, (v) => { o.id = v.trim(); zmiana(); });
    poleWybor(box, 'model', o.file || 'suche_drzewko', MODELE, (v) => { o.file = v; zmiana(); });
    poleSuwak(box, 'wysokość [m]', o.wysokosc ?? 2.4, { min:1, max:5, krok:.1 }, (v) => { o.wysokosc = v; zmiana(); });
    poleSuwak(box, 'obrót [rad]', o.obrot ?? 0, { min:-3.15, max:3.15, krok:.01 }, (v) => { o.obrot = v; zmiana(); });
    poleSuwak(box, 'zasięg pracy', o.zasieg ?? 1.6, { min:.8, max:3.5, krok:.05 }, (v) => { o.zasieg = v; zmiana(); });
    poleSuwak(box, 'kolizja r', o.kolizja ?? .5, { min:.1, max:1.5, krok:.05 }, (v) => { o.kolizja = v; zmiana(); });
    podpowiedz(box, 'Ścinamy TYLKO suche drzewka — żywy las zostaje. Po ścięciu zostaje pieniek, a obok niego stos drewna, po który dziecko wraca i niesie go na plac.');
    podpowiedz(box, 'Kolizja MUSI być mniejsza od zasięgu pracy, inaczej bohater zatrzyma się dalej, niż sięga piła, i ścinanie nigdy nie ruszy. Domyślnie 0,5 przy zasięgu 1,6.');
    if ((o.kolizja ?? .5) >= (o.zasieg ?? 1.6))
      podpowiedz(box, 'UWAGA: kolizja jest większa lub równa zasięgowi — tego drzewka nie da się ściąć.');
  }
  if (wybor.typ === 'schronienie') {
    poleSuwak(box, 'skala', o.skala ?? 1, { min:.5, max:2.5, krok:.05 }, (v) => { o.skala = v; zmiana(); });
    poleSuwak(box, 'obrót [rad]', o.obrot ?? 0, { min:-3.15, max:3.15, krok:.01 }, (v) => { o.obrot = v; zmiana(); });
    poleSuwak(box, 'zasięg oddania', o.zasieg ?? 1.35, { min:.8, max:3, krok:.05 }, (v) => { o.zasieg = v; zmiana(); });
    poleTekst(box, 'opis (tylko dla ludzi)', o.opis, (v) => { o.opis = v; zmiana(); });
    podpowiedz(box, 'Tu stanie domek na drzewie — i tu dziecko przynosi materiał. Przerywany krąg to odległość, z której lisek oddaje ładunek; obrót ustawia, w którą stronę patrzy budowla i po których stronach klepiska ląduje drewno i kamienie.');
    podpowiedz(box, 'Liczby przy kreskowanych liniach to długość kursu z materiałem. Poniżej ~2,5 doniesienie przestaje być kursem, a robi się krokiem w bok — a to właśnie ten kurs zamienia „zdobyłem” w „przyniosłem”.');
    const kasuj = document.createElement('button');
    kasuj.className = 'groza';
    kasuj.textContent = 'Usuń plac budowy (Delete)';
    kasuj.onclick = () => { delete mapa.schronienie; wybor = null; zapisz(); rysuj(); };
    box.appendChild(kasuj);
  }
  if (wybor.typ === 'kwiat') {
    poleWybor(box, 'odmiana', KWIATY_ODMIANY[o.wariant ?? 0].nazwa, KWIATY_ODMIANY.map((w) => w.nazwa),
      (v) => { o.wariant = KWIATY_ODMIANY.findIndex((w) => w.nazwa === v); zmiana(); });
    poleSuwak(box, 'skala', o.skala ?? 1, { min:.5, max:2.5 }, (v) => { o.skala = v; zmiana(); });
    poleSuwak(box, 'obrót [rad]', o.obrot ?? 0, { min:-3.15, max:3.15, krok:.01 }, (v) => { o.obrot = v; zmiana(); });
    podpowiedz(box, 'Kwiat nie blokuje chodzenia. Bez ustawionego kąta obrót losuje się z numeru kwiatu — suwak przejmuje nad nim kontrolę. Skala mnoży i wzrost, i główkę.');
  }
  if (wybor.typ === 'fasola') {
    poleSuwak(box, 'obrót [rad]', o.obrot ?? 0, { min:-3.15, max:3.15, krok:.01 }, (v) => { o.obrot = v; zmiana(); });
    poleSuwak(box, 'zasięg podlewania', o.zasieg ?? 1.9, { min:.8, max:4, krok:.1 }, (v) => { o.zasieg = v; zmiana(); });
    poleTekst(box, 'świat po wspinaczce', o.dalej ?? '', (v) => { if (v) o.dalej = v; else delete o.dalej; zmiana(); });
    podpowiedz(box, 'Zasięg to promień, w którym roślina przyjmuje kroplę i w którym zaczyna się wspinaczka — dziecko widzi go w scenie jako krąg aktywności. „Świat po wspinaczce” to nazwa mapy, na którą przenosi szczyt (np. w3); pusto = szczyt nigdzie nie prowadzi.');
    podpowiedz(box, 'Etapy rośliny — wysokości, model ziarna, krzywa wygięcia — stroi się osobno, w /scena-3d/edytor-fasoli.html. Tu ustawiasz tylko, GDZIE roślina stoi i jak daleko słyszy.');
  }
  if (wybor.typ === 'oczko') {
    poleSuwak(box, 'promień', o.promien ?? 1.4, { min:.6, max:4, krok:.1 }, (v) => { o.promien = v; zmiana(); });
    poleSuwak(box, 'głębokość', o.glebokosc ?? .11, { min:.04, max:.4, krok:.01 }, (v) => { o.glebokosc = v; zmiana(); });
    poleSuwak(box, 'obrys (ziarno)', o.ziarno ?? 1, { min:1, max:12, krok:1 }, (v) => { o.ziarno = Math.round(v); zmiana(); });
    podpowiedz(box, 'Lisek nabiera wody, wchodząc w oczko — liczy się 85 % promienia. Niecka i piaskowy brzeg dorabiają się w terenie same, więc po przesunięciu oczka teren przeliczy się przy następnym wczytaniu sceny.');
    podpowiedz(box, '„Obrys” to ziarno losowe nieregularnego kształtu brzegu. Zmieniaj, aż kształt się spodoba — na geometrię gry nie wpływa.');
  }
  if (wybor.typ === 'start') {
    poleSuwak(box, 'obrót [rad]', mapa.start.obrot ?? 0, { min:-3.15, max:3.15, krok:.01 },
      (v) => { mapa.start.obrot = v; zmiana(); });
    /* Przycisk jest tu, bo START MUSI BYC CHODZALNY. Postawiony w rzece albo
       poza promieniem swiata wpycha bohatera w stan "stoje tam, gdzie nie
       wolno" - a wtedy kolizja przepuszcza juz wszystko i da sie chodzic po
       wodzie. Dosuniecie do sciezki to najkrotsza droga z powrotem na ladu. */
    const doSciezki = document.createElement('button');
    doSciezki.textContent = 'Dosuń do ścieżki';
    doSciezki.onclick = () => {
      const s = mapa.sciezka || [];
      if (!s.length) return;
      const r = (mapa.swiat?.promien ?? 14) - 0.7;
      const kandydat = s.find((q) => Math.hypot(q[0], q[1]) <= r) || s[0];
      const i = s.indexOf(kandydat);
      const dalej = s[Math.min(i + 6, s.length - 1)];
      mapa.start.pos = [kandydat[0], kandydat[1]];
      mapa.start.obrot = Math.round(Math.atan2(dalej[0] - kandydat[0], dalej[1] - kandydat[1]) * 1000) / 1000;
      zapisz();
      rysuj();
    };
    box.appendChild(doSciezki);
    podpowiedz(box, 'Miejsce, w którym lisek pojawia się po wejściu na mapę — niezależne od ścieżki. Kreska pokazuje, w którą stronę patrzy. Trzymaj punkt na trawie: start w rzece albo poza krawędzią świata psuje kolizję i pozwala chodzić po wodzie.');
  }
  if (wybor.typ === 'latarnia') {
    zapewnijWezly();
    poleSuwak(box, 'węzeł ścieżki', mapa.sciezkaWezly.wezelLatarni ?? 0,
      { min:0, max:Math.max(0, wezly().length - 1), krok:1 },
      (v) => { mapa.sciezkaWezly.wezelLatarni = Math.round(v); przeliczSciezke(); zmiana(); });
    podpowiedz(box, 'Do którego węzła ścieżki bohater dochodzi, gdy sam rusza do latarni. Indeks w wypalonej łamanej (`punktSciezki`) przelicza się sam.');
    /* Latarnia jest w mapie POJEDYNCZYM obiektem, nie pozycją w tablicy, więc
       nie da się jej „wyciąć" jak drzewa — scena i tak by ją zbudowała, tylko
       na pozycji domyślnej. Zamiast tego przełącznik ustawia flagę `ukryta`,
       którą scena sprawdza przed dodaniem bryły, cienia i kolizji. Jeden
       przycisk w obie strony, bo to jest stan, a nie czynność bez powrotu. */
    const przelacz = document.createElement('button');
    const jestUkryta = !!mapa.latarnia?.ukryta;
    przelacz.className = jestUkryta ? '' : 'groza';
    przelacz.textContent = jestUkryta ? 'Przywróć latarnię' : 'Ukryj latarnię (Delete)';
    przelacz.onclick = () => {
      if (!mapa.latarnia) return;
      if (jestUkryta) delete mapa.latarnia.ukryta;
      else mapa.latarnia.ukryta = true;
      zapisz();
      rysuj();
    };
    box.appendChild(przelacz);
