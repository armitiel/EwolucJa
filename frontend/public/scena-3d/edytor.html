    if (jestUkryta) podpowiedz(box, 'Latarnia jest ukryta: nie ma jej w scenie ani jako przeszkody. Jej uchwyt zostaje na mapie, żeby dało się ją przywrócić — bohater nadal chodzi do wskazanego węzła ścieżki.');
  }
  if (wybor.typ === 'sciezka') {
    const i = Number(wybor.idx);
    const rzad = document.createElement('div');
    rzad.className = 'przyciski-rzad';
    const dodaj = (gdzie, tekst) => {
      const b = document.createElement('button');
      b.textContent = tekst;
      b.onclick = () => wstawPunktSciezki(gdzie === 'przed' ? i : i + 1);
      rzad.appendChild(b);
    };
    dodaj('przed', '+ punkt przed');
    dodaj('po', '+ punkt po');
    box.appendChild(rzad);
    ustawieniaLuku(box);
    podpowiedz(box, 'Punkt „po” dokłada się w połowie odcinka do następnego; na końcu ścieżki przedłuża ją w tym samym kierunku. Ten sam efekt da klik w plusik na odcinku w trybie Ścieżka.');
  }
  if (wybor.typ === 'galaz') {
    const [gi] = String(wybor.idx).split(':').map(Number);
    const g = mapa.galezie[gi];
    const przelicz = () => { przeliczGalezie(); zapisz(); rysuj(); };
    poleSuwak(box, 'węzeł startowy', g.od ?? 0, { min:0, max: Math.max(0, wezly().length - 1), krok:1 },
      (v) => { g.od = Math.round(v); przelicz(); });
    poleSuwak(box, 'łuk', g.gladkosc ?? .6, { min:0, max:1, krok:.05 }, (v) => { g.gladkosc = v; przelicz(); });
    poleSuwak(box, 'gęstość', g.probki ?? 8, { min:1, max:16, krok:1 }, (v) => { g.probki = Math.round(v); przelicz(); });
    poleSuwak(box, 'szerokość', g.szerokosc ?? .75, { min:.3, max:1.6, krok:.05 }, (v) => { g.szerokosc = v; przelicz(); });

    const rzad = document.createElement('div');
    rzad.className = 'przyciski-rzad';
    const przedluz = document.createElement('button');
    przedluz.textContent = '+ punkt na końcu';
    przedluz.onclick = () => {
      const P = g.punkty;
      const a = P[P.length - 2] || P[0], b = P[P.length - 1];
      P.push([zaokr(b[0] + (b[0] - a[0])), zaokr(b[1] + (b[1] - a[1]))]);
      wybor = { typ:'galaz', idx: gi + ':' + (P.length - 1) };
      przelicz();
    };
    const kasujGalaz = document.createElement('button');
    kasujGalaz.className = 'groza';
    kasujGalaz.textContent = 'Usuń całą gałąź';
    kasujGalaz.onclick = () => { mapa.galezie.splice(gi, 1); wybor = null; przelicz(); };
    rzad.append(przedluz, kasujGalaz);
    box.appendChild(rzad);
    podpowiedz(box, 'Gałąź zaczyna się w wybranym węźle ścieżki i idzie za nią, gdy ścieżkę przesuniesz. Delete kasuje pojedynczy punkt (a przy dwóch — całą gałąź). W trybie „+ Gałąź” klik w puste miejsce przedłuża zaznaczoną odnogę.');
  }
  if (wybor.typ === 'rzeka') {
    const [nr, rola] = String(wybor.idx).split(':');
    const k = mapa.rzeka.krzywe[nr];
    poleSuwak(box, 'gładkość', k.kroki ?? 12, { min:2, max:40, krok:1 }, (v) => { k.kroki = Math.round(v); zmiana(); });
    const rzad = document.createElement('div');
    rzad.className = 'przyciski-rzad';
    const dodajOdcinek = document.createElement('button');
    dodajOdcinek.textContent = '+ odcinek';
    dodajOdcinek.onclick = () => {
      const ost = mapa.rzeka.krzywe[mapa.rzeka.krzywe.length - 1];
      const kier = [ost.do[0] - ost.kontrola[0], ost.do[1] - ost.kontrola[1]];
      mapa.rzeka.krzywe.push({
        od: [...ost.do],
        kontrola: [zaokr(ost.do[0] + kier[0]), zaokr(ost.do[1] + kier[1])],
        do: [zaokr(ost.do[0] + kier[0] * 2.2), zaokr(ost.do[1] + kier[1] * 2.2)],
        kroki: 10,
      });
      wybor = { typ:'rzeka', idx: (mapa.rzeka.krzywe.length - 1) + ':do' };
      zmiana();
    };
    const usunOdcinek = document.createElement('button');
    usunOdcinek.className = 'groza';
    usunOdcinek.textContent = 'usuń odcinek';
    usunOdcinek.onclick = () => {
      if (mapa.rzeka.krzywe.length < 2) return;
      mapa.rzeka.krzywe.splice(Number(nr), 1);
      wybor = null;
      zmiana();
    };
    rzad.append(dodajOdcinek, usunOdcinek);
    box.appendChild(rzad);
    podpowiedz(box, rola === 'kontrola'
      ? 'Biała kropka to punkt sterujący — rzeka do niego nie dochodzi, tylko się w jego stronę wygina. Im dalej ją odciągniesz, tym ostrzejszy łuk.'
      : 'Niebieskie kropki to końce odcinka. Kolejny odcinek zaczyna się tam, gdzie kończy się poprzedni — przesuwając wspólny koniec, przesuwasz oba.');
  }
  if (wybor.typ === 'most') podpowiedz(box, 'Most obraca się sam wzdłuż drugiego odcinka ścieżki i tylko po nim da się przejść rzekę. Przesuwając most, przesuń też ścieżkę.');

  if (['znak','budynek','drzewo','glaz','sciezka','kwiat'].includes(wybor.typ)) {
    const kasuj = document.createElement('button');
    kasuj.className = 'groza';
    kasuj.textContent = 'Usuń (Delete)';
    kasuj.onclick = usunWybor;
    box.appendChild(kasuj);
  }
}

/* ── Dodawanie i kasowanie ───────────────────────────────────────────────── */
/**
 * Suche drzewko dostaje ID OD RAZU, a nie „kiedyś, jak ktoś pamięta". Zapis
 * zadania (`zadanieDrewna.js`) pamięta po tym identyfikatorze, że to drzewko
 * już ścięto — bez niego wracałoby na polanę całe przy każdym wejściu.
 */
function noweSucheDrzewko(x, z) {
  let n = 1;
  while ((mapa.sucheDrzewka || []).some((d) => d.id === 'drzewko-' + n)) n++;
  return { id:'drzewko-' + n, file:'suche_drzewko', pos:[x, z], wysokosc:2.4, obrot:0,
           zasieg:1.6, kolizja:.5 };
}

function nowyZnak(x, z) {
  const file = $('#model').value || 'gwiazda';
  let n = 1;
  while ((mapa.znaki || []).some((s) => s.id === file + '-' + n)) n++;
  return { id:file + '-' + n, file, label:'Nowy znak', toast:'', pos:[x, z], scale:1, height:1.1,
           glow:0xFFD269, ringColor:0xFFE7B0, haloOpacity:.12, ringOpacity:.2, lightBase:0,
           metalness:0, roughness:.85, jasnosc:1.3, absorb:true, absorbLift:1.6, respawn:8 };
}

function dodajWPunkcie(x, z) {
  if (tryb === 'znak') {
    (mapa.znaki ||= []).push(nowyZnak(x, z));
    wybor = { typ:'znak', idx: mapa.znaki.length - 1 };
  } else if (tryb === 'budynek') {
    (mapa.budynki ||= []).push({ file: $('#model').value || 'hut2', pos:[x, z], wysokosc:3, obrot:0, promien:1.4, jasnosc:1.3 });
    wybor = { typ:'budynek', idx: mapa.budynki.length - 1 };
  } else if (tryb === 'drzewo') {
    (mapa.drzewa ||= []).push({ typ:'sosna', pos:[x, z], skala:1 });
    wybor = { typ:'drzewo', idx: mapa.drzewa.length - 1 };
  } else if (tryb === 'glaz') {
    (mapa.glazy ||= []).push({ pos:[x, z], skala:1 });
    wybor = { typ:'glaz', idx: mapa.glazy.length - 1 };
  } else if (tryb === 'suche') {
    (mapa.sucheDrzewka ||= []).push(noweSucheDrzewko(x, z));
    wybor = { typ:'suche', idx: mapa.sucheDrzewka.length - 1 };
  } else if (tryb === 'kwiat') {
    (mapa.kwiaty ||= []).push({ wariant: Math.floor(Math.random() * KWIATY_ODMIANY.length), pos:[x, z], skala:1 });
    // Postawiony kwiat musi byc widoczny i chwytliwy od razu, inaczej narzedzie
    // wyglada na zepsute: klikasz, a na planie nic sie nie da ruszyc.
    kwiatyGrupa.pokaz = true;
    kwiatyGrupa.otwarta = true;
    zapiszUiKwiatow();
    wybor = { typ:'kwiat', idx: mapa.kwiaty.length - 1 };
  } else if (tryb === 'oczko' || tryb === 'wzgorze') {
    /* JEDNO NARZĘDZIE, DWA ODRUCHY — tak samo jak przy gałęziach ścieżki:
       klik przy zaznaczonym kształcie tego samego rodzaju PRZEDŁUŻA obrys,
       klik bez zaznaczenia zaczyna nowy. Bez tego trzeba by osobnego
       przycisku „zakończ kształt", a to jeden klik więcej przy każdym stawie. */
    if (wybor && wybor.typ === tryb) {
      const k = ksztaltWyboru();
      if (k && Array.isArray(k.punkty)) {
        k.punkty.push([x, z]);
        wybor = { typ:tryb, idx: String(wybor.idx).split(':')[0] + ':' + (k.punkty.length - 1) };
        zapisz(); rysuj();
        return true;
      }
    }
    /* Nowy kształt zaczyna od TRÓJKĄTA wokół kliknięcia, nie od jednego punktu.
       Obrys z jednym punktem nie jest jeszcze kształtem — nie ma czego pokazać
       ani w scenie, ani na planie, więc narzędzie wyglądałoby na zepsute. */
    const r = tryb === 'oczko' ? 1.3 : 1.8;
    const punkty = [0, 1, 2, 3, 4].map((i) => {
      const t = (i / 5) * Math.PI * 2;
      return [zaokr(x + Math.cos(t) * r), zaokr(z + Math.sin(t) * r)];
    });
    if (tryb === 'oczko') {
      (mapa.oczka ||= []).push({ punkty, glebokosc:.14, stok:.9 });
      wybor = { typ:'oczko', idx:(mapa.oczka.length - 1) + ':0' };
    } else {
      (mapa.formyTerenu ||= []).push({ typ:'wzgorze', punkty, wysokosc:.6, plaski:.2 });
      wybor = { typ:'wzgorze', idx:(mapa.formyTerenu.length - 1) + ':0' };
    }
  } else if (tryb === 'sciezka') {
    zapewnijWezly();
    wezly().push([x, z]);
    wybor = { typ:'sciezka', idx: wezly().length - 1 };
    przeliczSciezke();
  } else if (tryb === 'galaz') {
    zapewnijWezly();
    zapewnijGalezie();
    // Klik przy zaznaczonym węźle gałęzi PRZEDŁUŻA tę gałąź; klik bez
    // zaznaczenia (albo z zaznaczeniem czegoś innego) zaczyna nową odnogę
    // w najbliższym węźle ścieżki. Jedno narzędzie, dwa naturalne odruchy.
    if (wybor && wybor.typ === 'galaz') {
      const gi = Number(String(wybor.idx).split(':')[0]);
      const g = mapa.galezie[gi];
      if (g) {
        g.punkty.push([x, z]);
        wybor = { typ:'galaz', idx: gi + ':' + (g.punkty.length - 1) };
        przeliczGalezie();
        zapisz(); rysuj();
        return true;
      }
    }
    const od = najblizszyWezel(x, z);
    mapa.galezie.push({ od, punkty: [[...wezly()[od]], [x, z]], gladkosc:.6, probki:8, szerokosc:.75 });
    wybor = { typ:'galaz', idx: (mapa.galezie.length - 1) + ':1' };
    przeliczGalezie();
  } else {
    return false;
  }
  zapisz();
  rysuj();
  return true;
}

/**
 * Wstawia wierzcholek sciezki NA POZYCJI `i` (0 = przed pierwszym, dlugosc = na koncu).
 * W srodku ścieżki punkt ląduje w połowie odcinka, na końcach — przedłuża linię
 * w tym samym kierunku, żeby „extend" nie wymagał celowania myszą.
 */
function wstawPunktSciezki(i) {
  zapewnijWezly();
  const sc = mapa.sciezkaWezly.punkty;
  const sr = (a, b) => [zaokr((a[0] + b[0]) / 2), zaokr((a[1] + b[1]) / 2)];
  const przedluz = (a, b) => [zaokr(b[0] + (b[0] - a[0])), zaokr(b[1] + (b[1] - a[1]))];
  let nowy;
  if (sc.length === 0) nowy = [0, 0];
  else if (i <= 0) nowy = sc.length > 1 ? przedluz(sc[1], sc[0]) : [sc[0][0], sc[0][1] - 1];
  else if (i >= sc.length) nowy = sc.length > 1 ? przedluz(sc[sc.length - 2], sc[sc.length - 1])
                                                : [sc[0][0], sc[0][1] + 1];
  else nowy = sr(sc[i - 1], sc[i]);
  sc.splice(i, 0, nowy);
  if (mapa.sciezkaWezly.wezelLatarni >= i) mapa.sciezkaWezly.wezelLatarni++;
  wybor = { typ:'sciezka', idx: i };
  przeliczSciezke();
  zapisz();
  rysuj();
}

function usunWybor() {
  if (!wybor) return;
  if (wybor.typ === 'sciezka') {
    const i = Number(wybor.idx);
    wezly().splice(i, 1);
    if (mapa.sciezkaWezly.wezelLatarni > i) mapa.sciezkaWezly.wezelLatarni--;
    wybor = null;
    przeliczSciezke();
    zapisz();
    rysuj();
    return;
  }
  if (wybor.typ === 'galaz') {
    const [gi, i] = String(wybor.idx).split(':').map(Number);
    const g = mapa.galezie?.[gi];
    if (!g) return;
    // Gałąź z samą kotwicą to kreska donikąd — kasujemy wtedy całą odnogę.
    if (g.punkty.length <= 2) mapa.galezie.splice(gi, 1);
    else g.punkty.splice(i, 1);
    wybor = null;
    przeliczGalezie();
    zapisz(); rysuj();
    return;
  }
  /* LATARNIA NIE JEST POZYCJĄ W TABLICY, tylko pojedynczym obiektem w mapie —
     i przez to Delete na niej dotąd NIC NIE ROBIŁ (leciał do `if (!nazwa) return`).
     Nie da się jej też po prostu wykasować z mapy: scena buduje latarnię
     bezwarunkowo i przy braku klucza bierze pozycję domyślną, więc „usunięcie"
     tylko przestawiałoby ją w inne miejsce. Dlatego kasowanie to tu UKRYCIE:
     flaga `ukryta`, którą scena sprawdza przed dodaniem bryły, cienia i kółka
     kolizji. Uchwyt zostaje na mapie (przygaszony), żeby dało się ją przywrócić
     bez grzebania w JSON-ie. */
  if (wybor.typ === 'latarnia') {
    if (!mapa.latarnia) return;
    mapa.latarnia.ukryta = true;
    zapisz();
    rysuj();
    return;
  }
  /* Wierzchołek obrysu kasuje się pojedynczo, ale obrys z dwoma punktami to
     już nie kształt — wtedy schodzi cały staw albo całe wzgórze. */
  if (wybor.typ === 'oczko' || wybor.typ === 'wzgorze') {
    const [gi, i] = String(wybor.idx).split(':').map(Number);
    const lista = wybor.typ === 'oczko' ? mapa.oczka : mapa.formyTerenu;
    const k = lista?.[gi];
    if (!k) return;
    if (!Array.isArray(k.punkty) || k.punkty.length <= 3) lista.splice(gi, 1);
    else k.punkty.splice(i, 1);
    wybor = null;
    zapisz(); rysuj();
    return;
  }
  /* PLAC BUDOWY da się skasować NA PRAWDĘ, w odróżnieniu od latarni: scena
     czyta `mapa.schronienie` i przy braku klucza po prostu go nie stawia
     (`mapa.js` zwraca null, `ustawSchronienie` wychodzi od razu). Żadnej
     pozycji domyślnej, więc nie ma czego ukrywać. */
  if (wybor.typ === 'schronienie') {
    delete mapa.schronienie;
    wybor = null;
    zapisz();
    rysuj();
    return;
  }
  const tablice = { znak:'znaki', budynek:'budynki', drzewo:'drzewa', glaz:'glazy', kwiat:'kwiaty',
                    suche:'sucheDrzewka' };
  const nazwa = tablice[wybor.typ];
  if (!nazwa) return;
  mapa[nazwa].splice(Number(wybor.idx), 1);
  wybor = null;
  zapisz();
  rysuj();
}

/**
 * Sąsiednie odcinki rzeki dzielą wspólny koniec. Gdyby każdy trzymał własną
 * kopię współrzędnych, przeciągnięcie jednego zostawiałoby w wodzie dziurę —
 * więc po ruchu końcem dosuwamy sąsiada.
 */
function sklejRzeke(idx) {
  const [nr, rola] = idx.split(':');
  const i = Number(nr);
  const K = mapa.rzeka?.krzywe || [];
  if (rola === 'do' && K[i + 1]) K[i + 1].od = [...K[i].do];
  if (rola === 'od' && K[i - 1]) K[i - 1].do = [...K[i].od];
}

/* ── Mysz na planie ──────────────────────────────────────────────────────── */
function doSwiata(ev) {
  const pkt = plan.createSVGPoint();
  pkt.x = ev.clientX;
  pkt.y = ev.clientY;
  const m = pkt.matrixTransform(plan.getScreenCTM().inverse());
  return [zaokr(m.x), zaokr(m.y)];
}

let ciagniecie = null;

plan.addEventListener('pointerdown', (ev) => {
  if (ev.button !== 0 || spacja) return;      // prawy/środkowy i spacja = przesuwanie widoku
  const cel = ev.target.dataset && ev.target.dataset.typ ? ev.target : null;
  const [x, z] = doSwiata(ev);
  if (cel && cel.dataset.typ === 'wstaw-sciezke') { wstawPunktSciezki(Number(cel.dataset.idx)); return; }

  if (cel && (cel.dataset.typ === 'uchwyt-obrot' || cel.dataset.typ === 'uchwyt-skala')) {
    const o = obiektWyboru();
    if (!o) return;
    const bok = Math.hypot(x - o.pos[0], z - o.pos[1]) || 1;
    ciagniecie = {
      uchwyt: cel.dataset.typ === 'uchwyt-obrot' ? 'obrot' : 'skala',
      o, bazaDystans: bok, bazaSkala: o[POLE_SKALI[wybor.typ]] ?? 1,
    };
    plan.setPointerCapture(ev.pointerId);
    return;
  }

  /* PRZECIĄGANIE CAŁEGO OBRYSU. Wielobok nie ma jednego `pos`, więc nie da
     się go ruszyć zwykłą ścieżką (`ciagniecie.pos`) — przesuwamy wszystkie
     wierzchołki o ten sam wektor, licząc od ZAPAMIĘTANEGO stanu początkowego.
     Liczenie przyrostowo (klatka po klatce) kumulowałoby błąd zaokrąglenia
     do dwóch miejsc i kształt powoli by się rozjeżdżał. */
  if (cel && /-ksztalt$/.test(cel.dataset.typ || '')) {
    const typ = cel.dataset.typ.replace('-ksztalt', '');
    wybor = { typ, idx: cel.dataset.idx + ':0' };
    const k = ksztaltWyboru();
    if (k?.punkty) {
      ciagniecie = { punkty: k.punkty, start: k.punkty.map((q) => [...q]), gx:x, gz:z };
      plan.setPointerCapture(ev.pointerId);
    }
    rysuj();
    return;
  }

  if (cel) {
    wybor = { typ: cel.dataset.typ, idx: cel.dataset.idx };
    const o = obiektWyboru();
    if (o && o.pos) {
      ciagniecie = { pos: o.pos, dx: o.pos[0] - x, dz: o.pos[1] - z };
      plan.setPointerCapture(ev.pointerId);
    }
    rysuj();
    return;
  }
  if (!dodajWPunkcie(x, z)) {
    // W trybie „Wybierz" puste tło nie ma co dodawać — więc ciągnięcie po nim
    // przesuwa mapę. To najczęstszy odruch i szkoda kazać komuś szukać spacji.
    wybor = null;
    rysuj();
    panowanie = { x: ev.clientX, y: ev.clientY, start: { ...widok } };
    plan.setPointerCapture(ev.pointerId);
    plan.classList.add('lapa-trzyma');
  }
});

plan.addEventListener('pointermove', (ev) => {
  if (!ciagniecie) return;
  const [x, z] = doSwiata(ev);
  const o = ciagniecie.o;

  if (ciagniecie.uchwyt === 'obrot') {
    const kat = zaokr(Math.atan2(x - o.pos[0], z - o.pos[1]));
    o[POLE_OBROTU[wybor.typ] || 'obrot'] = kat;
    rysuj();
    return;
  }
  if (ciagniecie.punkty) {
    const dx = x - ciagniecie.gx, dz = z - ciagniecie.gz;
    ciagniecie.punkty.forEach((q, i) => {
      q[0] = zaokr(ciagniecie.start[i][0] + dx);
      q[1] = zaokr(ciagniecie.start[i][1] + dz);
    });
    rysuj();
    return;
  }

  if (ciagniecie.uchwyt === 'skala') {
    const d = Math.hypot(x - o.pos[0], z - o.pos[1]);
    const nowa = Math.max(.15, zaokr(ciagniecie.bazaSkala * (d / ciagniecie.bazaDystans)));
    o[POLE_SKALI[wybor.typ]] = nowa;
    rysuj();
    return;
  }

  ciagniecie.pos[0] = zaokr(x + ciagniecie.dx);
  ciagniecie.pos[1] = zaokr(z + ciagniecie.dz);
  if (wybor && wybor.typ === 'sciezka') przeliczSciezke();
  if (wybor && wybor.typ === 'galaz') przeliczGalezie();
  if (wybor && wybor.typ === 'rzeka') sklejRzeke(String(wybor.idx));
  rysuj();
});

plan.addEventListener('pointerup', () => {
  if (!ciagniecie) return;
  ciagniecie = null;
  zapisz();
});

/* ── Widok: zoom i przesuwanie ────────────────────────────────────────────
   Wszystko rysujemy w METRACH ŚWIATA, a kadrowaniem zajmuje się `viewBox`.
   Dzięki temu zoom i przesuwanie nie dotykają ani jednej współrzędnej obiektu —
   zmienia się tylko okno, przez które patrzymy.

   Przesuwanie idzie PRAWYM albo ŚRODKOWYM przyciskiem, ewentualnie ze spacją.
   Lewy jest zajęty: w trybach dodawania klik w puste miejsce stawia obiekt,
   więc gdyby przesuwał mapę, nie dałoby się niczego postawić.                */
/* Widok startowy liczy się Z MAPY, a nie ze stałej: przy R=8,5 planeta sięga
   πR ≈ 26,7, a sztywne 38 (czyli ±19) ucinało jej brzegi i utrwalało wrażenie,
   że świat kończy się tam, gdzie kończy się plan. */
function widokCalejPlanety() {
  const R = mapa?.swiat?.promienKuli ?? 8.5;
  const w = Math.PI * R * 2 + 3;
  return { x:-w / 2, y:-w / 2, w };
}
const WIDOK_STARTOWY = { x:-19, y:-19, w:38 };
let widok = { ...WIDOK_STARTOWY };
let spacja = false;

function zastosujWidok() {
  plan.setAttribute('viewBox', `${widok.x} ${widok.y} ${widok.w} ${widok.w}`);
}

/** Ile metrów świata przypada na piksel ekranu (viewBox jest kwadratowy, meet). */
function metryNaPiksel() {
  const s = Math.min(plan.clientWidth / widok.w, plan.clientHeight / widok.w);
  return 1 / (s || 1);
}

plan.addEventListener('wheel', (ev) => {
  ev.preventDefault();
  const [x, z] = doSwiata(ev);
  const k = ev.deltaY > 0 ? 1.12 : 1 / 1.12;
  const nowa = Math.min(120, Math.max(4, widok.w * k));
  widok = { x: x - (x - widok.x) * (nowa / widok.w), y: z - (z - widok.y) * (nowa / widok.w), w: nowa };
  zastosujWidok();
}, { passive: false });

plan.addEventListener('contextmenu', (ev) => ev.preventDefault());

let panowanie = null;

plan.addEventListener('pointerdown', (ev) => {
  if (ev.button !== 1 && ev.button !== 2 && !spacja) return;
  ev.preventDefault();
  ev.stopPropagation();
  panowanie = { x: ev.clientX, y: ev.clientY, start: { ...widok } };
  plan.setPointerCapture(ev.pointerId);
  plan.classList.add('lapa-trzyma');
}, true);   // faza przechwytywania — zanim zadziała zaznaczanie obiektów

plan.addEventListener('pointermove', (ev) => {
  if (!panowanie) return;
  const m = metryNaPiksel();
  widok.x = panowanie.start.x - (ev.clientX - panowanie.x) * m;
  widok.y = panowanie.start.y - (ev.clientY - panowanie.y) * m;
  zastosujWidok();
}, true);

function koniecPanowania() {
  if (!panowanie) return;
  panowanie = null;
  plan.classList.remove('lapa-trzyma');
}
plan.addEventListener('pointerup', koniecPanowania, true);
plan.addEventListener('pointercancel', koniecPanowania, true);

document.addEventListener('keydown', (ev) => {
  if (ev.code === 'Space' && !['INPUT','SELECT','TEXTAREA'].includes(ev.target.tagName)) {
    ev.preventDefault();
    spacja = true;
    plan.classList.add('lapa');
  }
});
document.addEventListener('keyup', (ev) => {
  if (ev.code === 'Space') { spacja = false; plan.classList.remove('lapa'); }
});

/* ── Klawiatura ──────────────────────────────────────────────────────────── */
document.addEventListener('keydown', (ev) => {
  if (['INPUT','SELECT','TEXTAREA'].includes(ev.target.tagName)) return;
  if (ev.ctrlKey && ev.key.toLowerCase() === 'z') { ev.preventDefault(); cofnij(); return; }
  if (ev.key === 'Delete' || ev.key === 'Backspace') { usunWybor(); return; }
  const o = obiektWyboru();
  if (!o) return;
  if (ev.key === 'q' || ev.key === 'e') {
    const polo = POLE_OBROTU[wybor.typ];
    if (!polo) return;
    const d = (ev.key === 'q' ? -1 : 1) * Math.PI / 12;
    o[polo] = zaokr((o[polo] ?? 0) + d);
    zapisz(); rysuj(); return;
  }
  if (ev.key === '[' || ev.key === ']') {
    const d = (ev.key === '[' ? -1 : 1) * .05;
    if ('skala' in o) o.skala = zaokr((o.skala ?? 1) + d);
    else if ('scale' in o) o.scale = zaokr((o.scale ?? 1) + d);
    zapisz(); rysuj(); return;
  }
  const ruch = { ArrowLeft:[-1,0], ArrowRight:[1,0], ArrowUp:[0,-1], ArrowDown:[0,1] }[ev.key];
  if (ruch && o.pos) {
    ev.preventDefault();
    const krok = ev.shiftKey ? .5 : .1;
    o.pos[0] = zaokr(o.pos[0] + ruch[0] * krok);
    o.pos[1] = zaokr(o.pos[1] + ruch[1] * krok);
    if (wybor.typ === 'sciezka') przeliczSciezke();
    if (wybor.typ === 'galaz') przeliczGalezie();
    zapisz(); rysuj();
  }
});

/* ── Własne modele 3D ─────────────────────────────────────────────────────
   Plik `.glb` idzie na końcówkę `/__model` serwera deweloperskiego, ta kładzie
   go w `public/scena-3d/assets/`. Scena ładuje modele po nazwie
   (`./assets/<nazwa>.glb`), więc od tej chwili wgrany obiekt można postawić
   jak każdy inny — jako budynek (z kolizją) albo jako znak minigry.

   Poza `npm run dev` końcówki nie ma i wgrywanie jest wyłączone — tak samo,
   jak zapis mapy. Na produkcji nikt nie wrzuca plików przez HTTP. */
async function odswiezModele(zaznacz) {
  try {
    const odp = await fetch('/__modele', { cache: 'no-cache' });
    const dane = await odp.json();
    if (dane?.ok && Array.isArray(dane.modele) && dane.modele.length)
      MODELE = [...new Set([...dane.modele, ...MODELE_WBUDOWANE])].sort();
  } catch { /* bez serwera dev zostaje lista wbudowana */ }
  rysujModele(zaznacz);
}

function rysujModele(zaznacz) {
  const wybrany = zaznacz || $('#model').value;
  $('#model').innerHTML = MODELE.map((m) => `<option>${m}</option>`).join('');
  if (MODELE.includes(wybrany)) $('#model').value = wybrany;
  if (mapa) rysujWlasciwosci();
}

async function wgrajModele(pliki) {
  const nazwy = [];
  for (const f of pliki) {
    const nazwa = f.name.replace(/\.glb$/i, '');
    try {
      const odp = await fetch('/__model?nazwa=' + encodeURIComponent(nazwa), {
        method: 'POST',
        headers: { 'content-type': 'application/octet-stream' },
        body: await f.arrayBuffer(),
      });
      const dane = await odp.json();
      if (!dane.ok) throw new Error(dane.blad);
      nazwy.push(dane.nazwa);
    } catch (e) {
      $('#info').textContent = 'nie wgrałem „' + f.name + '”: ' +
        (String(e.message || e).includes('Failed to fetch')
          ? 'wgrywanie działa tylko przy npm run dev'
          : String(e.message || e));
      return;
    }
  }
  await odswiezModele(nazwy[nazwy.length - 1]);
  $('#info').textContent = nazwy.length === 1
    ? 'wgrany model „' + nazwy[0] + '” — wybierz narzędzie + Budynek albo + Znak i kliknij na mapie'
    : 'wgrane modele: ' + nazwy.join(', ');
}

/* ── Podpięcie interfejsu ────────────────────────────────────────────────── */
rysujModele();
$('#btn-pobierz').onclick = pobierz;
$('#btn-zapisz').onclick = () => zapiszWProjekcie();
$('#auto').onchange = () => { if ($('#auto').checked) zapiszWProjekcie({ cicho: true }); };
$('#btn-cofnij').onclick = cofnij;
$('#btn-oryginal').onclick = () => wczytaj({ zSerwera: true });
$('#btn-odswiez').onclick = odswiezPodglad;
$('#btn-widok').onclick = () => { widok = widokCalejPlanety(); zastosujWidok(); };

$('#btn-model').onclick = () => $('#plik-model').click();
$('#plik-model').onchange = async (ev) => {
  const pliki = [...ev.target.files];
  ev.target.value = '';                    // ten sam plik ma dać się wgrać drugi raz
  if (pliki.length) await wgrajModele(pliki);
};

$('#btn-plik').onclick = () => $('#plik').click();
$('#plik').onchange = async (ev) => {
  const f = ev.target.files[0];
  if (f) ustaw(JSON.parse(await f.text()), 'plik ' + f.name);
};

$('#plik-mapy').textContent = PLIK_MAPY + (NAZWA_MAPY ? '' : '  (pierwszy świat)');
document.title = 'Edytor mapy — ' + PLIK_MAPY;

rysujNarzedzia();
odswiezModele();
wczytaj();
</script>
</body>
</html>
