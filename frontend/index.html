  <!-- ── Kurtyna z chmur ─────────────────────────────────────────────────
       Zasłania start swiata 3D. Siedzi w index.html, a NIE w komponencie
       Reacta, bo ma zakryc ROWNIEZ czas, zanim bundle sie sciagnie - gdyby
       byla w JS, dziecko zobaczylo by najpierw pusty ekran, a chmury
       pojawilyby sie dopiero po zaladowaniu tego, co maja zaslonic.
       Kolejnosc: chmury zsuniete -> scena gotowa -> chmury sie rozsuwaja
       -> dopiero potem wchodzi HUD.
       ──────────────────────────────────────────────────────────────────── -->
  <style>
    /* Kompozycja: RAMA z chmur wokol kadru, przeswit nieba w srodku, w nim
       kilka dalekich obloczkow. Wczesniej byla tu zbita sciana chmur - kryla
       ekran, ale czytala sie jak tapeta, bo nie mialo gdzie wejsc swiatlo.
       Krycie trzyma pelnoekranowe niebo (#chmury::before), wiec ksztalty nie
       musza juz zachodzic na siebie na cala szerokosc i moga uzywac powietrza. */
    #chmury {
      position: fixed; inset: 0; z-index: 60; pointer-events: none;
      overflow: hidden;
      /* Jednostka kompozycji. W pionie ~1vw, ale na szerokim ekranie liczona
         z wysokosci - inaczej chmurka szeroka na 80 jednostek zajmowalaby na
         desktopie pol metra ekranu i rama zamienialaby sie w sciane. */
      --u: 1vw;
    }
    /* Niebo pod chmurami zakrywa puste plotno WebGL, ale MUSI zejsc w momencie
       rozsuwania - inaczej miedzy rozjezdzajacymi sie chmurami widac je
       zamiast swiata i cala sztuczka nie ma sensu.
       Radialne, nie liniowe: swiatlo zbiera sie w srodku kadru, dokladnie tam,
       gdzie rama chmur zostawia przeswit - to ono robi wrazenie glebi. */
    #chmury::before {
      content: ""; position: absolute; inset: 0;
      background:
        radial-gradient(105% 70% at 50% 46%, #f2f9ff 0%, #dceafc 34%, #b7d2f4 70%, #9abbee 100%);
      transition: opacity .45s ease;
    }
    #chmury.rozsuwa::before { opacity: 0; }
    #chmury.znikly { display: none; }
    #chmury .chmurka {
      position: absolute; aspect-ratio: 438.1 / 263.5;   /* proporcje z public/cloud.svg */
      transition: transform 1.5s cubic-bezier(.45, .04, .2, 1);
      will-change: transform;
    }
    /* Osobna warstwa na dryf: gdyby animacja i przejscie ruszaly ta sama
       wlasciwoscia, zdjecie animacji kasowaloby odjazd w polowie drogi. */
    /* Ksztalt jest wstrzykiwany jako PRAWDZIWY <svg>, a nie tlo z data-URI.
       Powod: `vector-effect: non-scaling-stroke` na sciezce trzyma obrys
       w stalej grubosci niezaleznie od wielkosci chmurki. Przy tle-obrazku
       obrys skalowal sie razem z chmurka i olbrzym mial kreske pieciokrotnie
       grubsza niz maluch.
       Z tego samego powodu roznice wielkosci robimy SZEROKOSCIA elementu,
       a nie `transform: scale()` - transformacja CSS przeskalowalaby obrys
       mimo non-scaling-stroke. */
    #chmury .chmurka i { display: block; width: 100%; height: 100%; }
    #chmury .chmurka svg { display: block; width: 100%; height: 100%; overflow: visible; }

    /* Trzy plany glebi. Roznica jest w cieniu i sile obrysu - kolory dosypuje
       skrypt do gradientu, bo kazda chmurka ma wlasny <linearGradient>. */
    #chmury .blisko svg { filter: drop-shadow(0 12px 20px rgba(58, 96, 158, .26)); }
    #chmury .srodek svg { filter: drop-shadow(0 8px 14px rgba(58, 96, 158, .16)); }
    #chmury .daleko  svg { filter: none; opacity: .78; }
    #chmury .spod    svg { filter: drop-shadow(0 6px 12px rgba(58, 96, 158, .12)); }

    /* Dryf to samo przesuniecie - zadnego scale. Skalowanie tutaj wrocilo by
       tylnymi drzwiami do problemu z gruboscia obrysu. */
    @keyframes chmurka-dryf {
      0%, 100% { transform: translate(0, 0); }
      50%      { transform: translate(2.5%, -2.5%); }
    }
    #chmury:not(.rozsuwa) .chmurka i {
      animation: chmurka-dryf var(--dryf, 10s) ease-in-out infinite;
      animation-delay: var(--dryf-start, 0s);
    }

    /* Grupy odjezdzaja w swoje strony. Kazda chmurka ma wlasne opoznienie
       i wlasny czas (nadawane w skrypcie), wiec nie leca jak jedna plyta.
       Dystans TEZ jest wlasny (--odlot-x): staly nie moze byc, bo olbrzym
       rozciagniety do ~240vw po przesunieciu o 145vw wciaz stal polowa
       ksztaltu na ekranie. Skrypt liczy go z faktycznej szerokosci. */
    #chmury.rozsuwa .grupa-l { transform: translate(calc(-1 * var(--odlot-x, 160vw)), var(--odlot-y, 0px)); }
    #chmury.rozsuwa .grupa-p { transform: translate(var(--odlot-x, 160vw), var(--odlot-y, 0px)); }

    @media (prefers-reduced-motion: reduce) {
      #chmury .chmurka { transition: opacity .4s ease; }
      #chmury .chmurka i { animation: none !important; }
      #chmury.rozsuwa .chmurka { transform: none; opacity: 0; }
    }
  </style>

</head>
<body>
  <div id="chmury" aria-hidden="true"></div>

  <script>
    // Kurtyna dotyczy tylko swiata 3D. Na pozostalych ekranach jest schowana -
    // inaczej zaslanialaby logowanie i onboarding - ale zostaje gotowa do
    // postawienia, bo do swiata wchodzi sie takze z ekranu startowego.
    (function () {
      var chmury = document.getElementById('chmury');
      if (!chmury) return;

      /* Kurtyna NIE jest juz przywiazana do pierwszego wczytania strony.
         Wczesniej budowala sie wylacznie wtedy, gdy adres od razu zaczynal sie
         od /swiat, a na kazdym innym ekranie znikala z DOM-u na dobre. Skutek:
         dziecko, ktore weszlo do gry przyciskiem START, nie dostawalo kurtyny
         wcale - to przejscie robi router, a nie przeladowanie strony - i przez
         caly czas wczytywania sceny patrzylo na ciemne tlo huba.
         Teraz sa dwa wejscia: kurtyna stawia sie sama przy wczytaniu /swiat
         i daje sie postawic na zadanie przez `window.__zbudujChmury()`. */
      var rozsuniete = true;   // dopoki nie zbudowana, nie ma czego rozsuwac
      var bezpiecznik = 0;
      var najdluzej = 0;       // najdluzszy czas odlotu - z niego liczymy sprzatanie

      function los(min, max) { return min + Math.random() * (max - min); }

      // Jednostka kompozycji w px. W pionie to praktycznie 1vw; na szerokim
      // ekranie liczymy ja z wysokosci, zeby rama nie urosla na cala szerokosc.
      function przelicz() {
        var u = Math.min(window.innerWidth, window.innerHeight * 0.62) / 100;
        chmury.style.setProperty('--u', u.toFixed(3) + 'px');
      }
      przelicz();
      window.addEventListener('resize', przelicz);

      // KOMPOZYCJA. Rama z chmur przy krawedziach, przeswit nieba w srodku.
      //   y  - gora chmurki w % wysokosci ekranu
      //   k  - jak gleboko w kadr siega WEWNETRZNA krawedz, w jednostkach --u
      //   w  - szerokosc w jednostkach --u
      // Pozycje NIE podajemy wprost: wysuniecie poza brzeg to `k - w`. Dzieki
      // temu zmiana skali chmurki nie rusza przeswitu - rosnie na zewnatrz.
      //   p  - plan: 'blisko' (kraw), 'srodek', 'daleko' (obloczki w przeswicie)
      // Kolejnosc w tablicy nie ma znaczenia - warstwy ustawia `p`.
      var LEWE = [
        { y: -13.0, k:  46.0, w: 56.8, p: 'blisko' },
        { y:  -4.4, k:  38.8, w: 24.0, p: 'srodek' },
        { y:   4.2, k:  32.1, w: 42.0, p: 'blisko' },
        { y:  12.8, k:  26.1, w: 31.2, p: 'srodek' },
        { y:  21.4, k:  21.3, w: 62.0, p: 'blisko' },
        { y:  30.0, k:  17.9, w: 26.4, p: 'srodek' },
        { y:  38.6, k:  16.2, w: 48.0, p: 'blisko' },
        { y:  47.2, k:  16.2, w: 20.8, p: 'srodek' },
        { y:  55.8, k:  17.9, w: 56.8, p: 'blisko' },
        { y:  64.4, k:  21.3, w: 24.0, p: 'srodek' },
        { y:  73.0, k:  26.1, w: 42.0, p: 'blisko' },
        { y:  81.6, k:  32.1, w: 31.2, p: 'srodek' },
        { y:  90.2, k:  38.8, w: 62.0, p: 'blisko' },
        { y:  98.8, k:  46.0, w: 26.4, p: 'srodek' }
      ];
      var PRAWE = [
        { y: -17.0, k:  44.0, w: 60.0, p: 'srodek' },
        { y:  -8.4, k:  36.6, w: 32.8, p: 'blisko' },
        { y:   0.2, k:  29.6, w: 45.6, p: 'srodek' },
        { y:   8.8, k:  23.4, w: 22.4, p: 'blisko' },
        { y:  17.4, k:  18.5, w: 54.4, p: 'srodek' },
        { y:  26.0, k:  15.0, w: 29.6, p: 'blisko' },
        { y:  34.6, k:  13.2, w: 51.2, p: 'srodek' },
        { y:  43.2, k:  13.2, w: 25.6, p: 'blisko' },
        { y:  51.8, k:  15.0, w: 60.0, p: 'srodek' },
        { y:  60.4, k:  18.5, w: 32.8, p: 'blisko' },
        { y:  69.0, k:  23.4, w: 45.6, p: 'srodek' },
        { y:  77.6, k:  29.6, w: 22.4, p: 'blisko' },
        { y:  86.2, k:  36.6, w: 54.4, p: 'srodek' },
        { y:  94.8, k:  44.0, w: 29.6, p: 'blisko' }
      ];
      // Przeswit nie jest pusty: kilka bladych obloczkow daje mu glebie
      // (i przy okazji zasypuje przypadkowe dziury na nietypowych proporcjach).
      var SRODEK = [
        { y:   4, k:  47, w: 17, p: 'daleko', strona: 'l' },
        { y:  15, k:  51, w: 13, p: 'daleko', strona: 'p' },
        { y:  27, k:  54, w: 20, p: 'daleko', strona: 'p' },
        { y:  39, k:  44, w: 15, p: 'daleko', strona: 'l' },
        { y:  51, k:  54, w: 18, p: 'daleko', strona: 'p' },
        { y:  63, k:  45, w: 14, p: 'daleko', strona: 'l' },
        { y:  75, k:  56, w: 19, p: 'daleko', strona: 'p' },
        { y:  87, k:  45, w: 15, p: 'daleko', strona: 'l' }
      ];

      // Rama domknieta u gory i u dolu. Bez tych chmurek przeswit czyta sie jak
      // pionowy korytarz miedzy dwiema kolumnami, a nie jak okno w niebie.
      var GORA = [
        { y:  -9, k:  64, w: 54, p: 'blisko', strona: 'l' },
        { y: -11, k:  54, w: 46, p: 'blisko', strona: 'p' },
        { y:  -7, k:  68, w: 32, p: 'daleko', strona: 'l' },
        { y:  -8, k:  66, w: 34, p: 'daleko', strona: 'p' }
      ];
      var DOL = [
        { y:  88, k:  66, w: 58, p: 'blisko', strona: 'l' },
        { y:  92, k:  56, w: 50, p: 'blisko', strona: 'p' },
        { y:  80, k:  72, w: 40, p: 'srodek', strona: 'l' },
        { y:  83, k:  72, w: 44, p: 'srodek', strona: 'p' }
      ];

      // Palety: blizej = biel z lekkim blekitem u dolu, dalej = coraz bardziej
      // rozmyte w niebie. To one, a nie rozmiar, robia wrazenie odleglosci.
      var PALETY = {
        blisko: { a: '#ffffff', b: '#f4fbff', c: '#cbe2fb', obrys: '#6f9ddb', kreska: 2.4 },
        srodek: { a: '#fdffff', b: '#e8f4ff', c: '#bcd8f8', obrys: '#7ea9e0', kreska: 2.0 },
        spod:   { a: '#ffffff', b: '#fbfdff', c: '#e4f0fd', obrys: '#a8c6ec', kreska: 1.6 },
        daleko: { a: '#f3faff', b: '#dcedfc', c: '#bed8f6', obrys: '#98bde9', kreska: 1.4 }
      };

      function svgChmurki(lustro, id, p) {
        // Ksztalt 1:1 z `public/cloud.svg`. Sciezka jest tu wklejona, a nie
        // ladowana jako <img>, bo tylko wtedy dziala non-scaling-stroke -
        // przy obrazku obrys skalowalby sie razem z chmurka.
        var SCIEZKA = 'M95.1,201.9c-30,0-52-22-52-50s19-47,44-50c6-34,35-59,71-59s43,10,56,27c12-26,39-44,70-44s74,32,74,72,0,10-1,15c31,4,55,30,55,61s-5.6,30.5-26,40c-43,19.9-94.1.8-94.1.8,0,0-50.5,42.2-132.9,1.2-25.4,9.8-57.5,2.2-64-14Z';
        return '<svg viewBox="0 0 438.1 263.5" xmlns="http://www.w3.org/2000/svg"' +
          (lustro ? ' style="transform:scaleX(-1)"' : '') + '>' +
          '<linearGradient id="' + id + '" x1="0" y1="0" x2=".18" y2="1">' +
            '<stop offset="0" stop-color="' + p.a + '"/>' +
            '<stop offset=".52" stop-color="' + p.b + '"/>' +
            '<stop offset="1" stop-color="' + p.c + '"/>' +
          '</linearGradient>' +
          '<path d="' + SCIEZKA + '" fill="url(#' + id + ')" stroke="' + p.obrys + '"' +
            ' stroke-width="' + p.kreska + '" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>' +
        '</svg>';
      }

      var WARSTWY = { spod: 3, daleko: 10, srodek: 30, blisko: 55 };

      // Warstwa spodnia. Nie jest osobna kompozycja, tylko cieniem tej z przodu:
      // ta sama chmurka, podniesiona i odrobine szersza, w jasniejszej palecie.
      // Dzieki temu zza kazdego ksztaltu wystaje drugi, jasniejszy garb - i rama
      // przestaje byc plaska wycinanka, a robi sie bankiem chmur o glebokosci.
      // Liczona ZE zdefiniowanej ramy, nie wpisana recznie: kazda zmiana ukladu
      // z gory przenosi sie tu sama.
      function podklad(def) {
        var w = def.w * (1.10 + (Math.round(def.w) % 7) / 50);   // 10-22% szersza, nierowno
        return {
          y: def.y - 4.4,             // podniesiona, wiec zza przedniej wystaje sam garb
          k: def.k - 2,               // plycej niz przednia - podklad nie zjada przeswitu
          w: w,
          p: 'spod',
          strona: def.strona
        };
      }
      var lista = [];

      function dodaj(def, strona, nr) {
        var el = document.createElement('div');
        var lewa = (def.strona || strona) === 'l';
        el.className = 'chmurka ' + (lewa ? 'grupa-l' : 'grupa-p') + ' ' + def.p;
        el.style.top = def.y + '%';
        var x = (def.k !== undefined ? def.k - def.w : def.x);   // wysuniecie poza brzeg
        el.style[lewa ? 'left' : 'right'] = 'calc(var(--u) * ' + x.toFixed(1) + ')';
        el.style.width = 'calc(var(--u) * ' + def.w + ')';
        el.style.zIndex = String(WARSTWY[def.p] + Math.round(los(0, 8)));

        var i = document.createElement('i');
        // Lustro co druga - inaczej cala rama ma ten sam profil i widac szablon.
        i.innerHTML = svgChmurki(nr % 2, 'chm' + nr, PALETY[def.p]);
        el.appendChild(i);

        el.style.setProperty('--dryf', los(9, 17).toFixed(1) + 's');
        // Ujemne opoznienie startu = kazda chmurka zaczyna dryf w innym miejscu
        // cyklu. Bez tego wszystkie oddychaja rownoczesnie i wyglada to jak puls.
        el.style.setProperty('--dryf-start', (-los(0, 9)).toFixed(1) + 's');
        el.style.setProperty('--odlot-y', Math.round(los(-45, 45)) + 'px');
        // Dystans odlotu liczony z FAKTYCZNEJ szerokosci chmurki plus jej
        // wysuniecie poza ekran - inaczej najszersza zostaje polowa w kadrze.
        el.style.setProperty('--odlot-x', 'calc(var(--u) * ' + Math.ceil(def.w + Math.abs(x) + 20) + ')');

        // Blizsze plany plyna wolniej - dalsze odlatuja szybciej, co samo
        // z siebie buduje glebie.
        var czas = def.p === 'blisko' ? los(1.6, 2.0)
          : def.p === 'spod'  ? los(1.75, 2.15)   // najglebsza warstwa plynie najwolniej
          : def.p === 'daleko' ? los(1.05, 1.35) : los(1.3, 1.7);
        var zwloka = los(0, 0.26);
        el.style.transitionDuration = czas.toFixed(2) + 's';
        el.style.transitionDelay = zwloka.toFixed(2) + 's';
        najdluzej = Math.max(najdluzej, czas + zwloka);

        chmury.appendChild(el);
        lista.push(el);
      }

      /* Postawienie kurtyny. Wolane przy wczytaniu /swiat i z aplikacji, tuz
         PRZED przejsciem do swiata (przycisk START), zeby chmury zdazyly
         zakryc ekran, zanim router zdejmie poprzedni. */
      function zbuduj() {
        if (!rozsuniete) return;              // kurtyna juz wisi
        chmury.innerHTML = '';
        lista.length = 0;
        najdluzej = 0;
        rozsuniete = false;
        window.__chmuryWisza = true;
        chmury.classList.remove('rozsuwa', 'znikly');
        przelicz();

        var nr = 0;
        // Najpierw podklad - kolejnosc w DOM nie decyduje (o tym jest z-index),
        // ale trzymanie go z przodu ulatwia czytanie w inspektorze.
        LEWE.forEach(function (d) { dodaj(podklad(d), 'l', nr++); });
        PRAWE.forEach(function (d) { dodaj(podklad(d), 'p', nr++); });
        GORA.forEach(function (d) { dodaj(podklad(d), 'l', nr++); });
        DOL.forEach(function (d) { dodaj(podklad(d), 'l', nr++); });
        LEWE.forEach(function (d) { dodaj(d, 'l', nr++); });
        PRAWE.forEach(function (d) { dodaj(d, 'p', nr++); });
        GORA.forEach(function (d) { dodaj(d, 'l', nr++); });
        DOL.forEach(function (d) { dodaj(d, 'l', nr++); });
        SRODEK.forEach(function (d) { dodaj(d, 'l', nr++); });

        // Bezpiecznik na wypadek, gdyby aplikacja nigdy nie zawolala (blad
        // bundla, wylaczony JS modulu): po 9 s kurtyna rozsuwa sie sama.
        window.clearTimeout(bezpiecznik);
        bezpiecznik = window.setTimeout(function () { rozsun(); }, 9000);
      }

      function rozsun(poZakonczeniu) {
        if (rozsuniete) { if (poZakonczeniu) poZakonczeniu(); return; }
        rozsuniete = true;
        window.__chmuryWisza = false;
        window.clearTimeout(bezpiecznik);
        chmury.classList.add('rozsuwa');
        // Czas sprzatania liczony z FAKTYCZNIE wylosowanych wartosci, a nie
        // wpisany na sztywno. Stala zawsze predzej czy pozniej rozjedzie sie
        // z losowaniem i ucina najwolniejsza chmurke w locie - a wtedy kawalek
        // ksztaltu po prostu znika w kadrze, zamiast z niego wyjechac.
        window.setTimeout(function () {
          chmury.classList.add('znikly');
          if (poZakonczeniu) poZakonczeniu();
        }, Math.ceil(najdluzej * 1000) + 120);
      }

      window.__zbudujChmury = zbuduj;
      window.__rozsunChmury = rozsun;
      window.__chmuryWisza = false;

      // Puste `#chmury` nadal malowaloby niebo (`::before` na calym ekranie),
      // wiec dopoki kurtyny nie ma, trzymamy je schowane.
      chmury.classList.add('znikly');
      if (location.pathname.indexOf('/swiat') === 0) zbuduj();
    })();
  </script>
